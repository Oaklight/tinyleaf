services:
  web:
    build: .
    ports:
      - "14159:14159"
    volumes:
      - ./projects:/data/projects
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--projects-dir", "/data/projects", "--docker", "--host", "0.0.0.0"]
    depends_on:
      - texlive

  texlive:
    image: oaklight/texlive:latest
    container_name: texlive-compiler
    volumes:
      - ./projects:/data/projects
    command: ["sleep", "infinity"]
