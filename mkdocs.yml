site_name: Tinyleaf
site_description: Tinyleaf - Lightweight, zero-dependency web-based LaTeX editor
site_author: Peng Ding
site_url: https://tinyleaf.readthedocs.io/en/latest
repo_name: Oaklight/tinyleaf
repo_url: https://github.com/Oaklight/tinyleaf
copyright: Copyright &copy; 2025 Peng Ding

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Home:
          - index.md
        Getting Started:
          - getting-started/installation.md
          - getting-started/quickstart.md
        Guide:
          - guide/architecture.md
          - guide/registry.md
          - guide/compilation.md
          - guide/docker.md
        API Reference:
          - api/index.md
        Changelog:
          - changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/tinyleaf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tinyleaf/
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh-cn/
      lang: zh

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guide:
      - Architecture: guide/architecture.md
      - Multi-Project Registry: guide/registry.md
      - Compilation: guide/compilation.md
      - Docker: guide/docker.md
  - API Reference:
      - api/index.md
  - Screenshots: screenshots.md
  - Changelog: changelog.md
