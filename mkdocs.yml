site_name: Tinyleaf
site_description: Tinyleaf - Lightweight, zero-dependency web-based LaTeX editor
site_author: Peng Ding
site_url: https://tinyleaf.readthedocs.io/en/latest
repo_name: Oaklight/tinyleaf
repo_url: https://github.com/Oaklight/tinyleaf
copyright: Copyright &copy; 2025 Peng Ding

theme:
  name: material
  logo: assets/brand/tinyleaf-leafpen-wordmark-light.svg
  favicon: assets/brand/tinyleaf-leafpen-icon.svg
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra_css:
  - stylesheets/tinyleaf.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/tinyleaf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tinyleaf/
  alternate:
    - name: English
      link: /en/latest/
      lang: en
    - name: 中文
      link: /zh-cn/latest/
      lang: zh

nav:
  - Home: index.md
  - Guide:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Architecture: guide/architecture.md
      - Multi-Project Registry: guide/registry.md
      - Compilation: guide/compilation.md
      - Docker: guide/docker.md
  - Screenshots: screenshots.md
  - Resources:
      - Overview: resources/index.md
      - API Reference: api/index.md
      - Brand: brand.md
  - Changelog: changelog.md
