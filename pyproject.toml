[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyleaf"
dynamic = ["version"]
authors = [{ name = "Oaklight", email = "oaklight@users.noreply.github.com" }]
description = "A lightweight, self-hosted Overleaf alternative — zero-dependency LaTeX web editor"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
keywords = [
    "latex",
    "editor",
    "overleaf",
    "texlive",
    "self-hosted",
    "web-editor",
    "pdf",
    "codemirror",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Editors",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://tinyleaf.readthedocs.io"
Repository = "https://github.com/Oaklight/tinyleaf"
Issues = "https://github.com/Oaklight/tinyleaf/issues"

[project.scripts]
tinyleaf = "tinyleaf.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff==0.15.20",
    "ty==0.0.54",
    "complexipy>=5.2.0",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]

[tool.setuptools.dynamic]
version = { attr = "tinyleaf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tinyleaf" = ["static/*.html", "static/css/*.css", "static/js/*.js", "static/assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/tinyleaf/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["UP007", "E501"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"
