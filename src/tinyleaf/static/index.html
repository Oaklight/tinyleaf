<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinyleaf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
<style>
/* ── CSS Variables (Light - default, from llm-rosetta) ── */
:root {
  --bg: #ffffff;
  --bg-card: #f6f8fa;
  --bg-hover: #eef1f5;
  --border: #d1d9e0;
  --text: #1f2328;
  --text-dim: #656d76;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --green: #1a7f37;
  --red: #cf222e;
  --orange: #bf8700;
  --blue: #0969da;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --sidebar-width: 260px;
  --toolbar-height: 48px;
  --statusbar-height: 28px;
}

/* ── Reset ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100vh; }

#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: var(--toolbar-height);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#main { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: var(--sidebar-width);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
#sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }

#workspace { flex: 1; display: flex; overflow: hidden; }

#editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
#editor-breadcrumb {
  display: flex;
  align-items: center;
  padding: 3px 10px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text-dim);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  gap: 6px;
  min-height: 24px;
}
#editor-breadcrumb #breadcrumb-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#editor-breadcrumb .icon-btn {
  width: 18px;
  height: 18px;
  padding: 2px;
}

#pdf-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 1px solid var(--border);
  min-width: 0;
}
#pdf-pane.collapsed { flex: 0 0 0px !important; min-width: 0; overflow: hidden; border-left: none; }

.resize-handle {
  width: 4px;
  cursor: col-resize;
  background: transparent;
  flex-shrink: 0;
  position: relative;
  z-index: 5;
  transition: background 0.15s;
}
.resize-handle:hover, .resize-handle.active { background: var(--accent); }

.panel-toggle {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--bg-card);
  border: none;
  color: var(--text-dim);
  flex-shrink: 0;
  font-size: 10px;
  padding: 0;
  transition: background 0.15s;
}
.panel-toggle:hover { background: var(--bg-hover); color: var(--text); }

#statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: var(--statusbar-height);
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}

/* ── Toolbar ── */
.toolbar-brand {
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
  margin-right: 4px;
  white-space: nowrap;
}

.toolbar-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 4px;
  flex-shrink: 0;
}

.toolbar-label {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}

/* ── Buttons & Controls ── */
button {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font);
  transition: all 0.15s;
}
button:hover { background: var(--bg-hover); }
button.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
button.primary:hover { background: var(--accent-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.sm { padding: 3px 8px; font-size: 12px; }
button.danger { color: var(--red); }
button.icon-btn {
  padding: 4px 6px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
button.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button.icon-btn:hover { color: var(--accent); background: var(--bg-hover); border-radius: var(--radius); }

select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
}
select:focus { border-color: var(--accent); outline: none; }
#main-file-select {
  max-width: 200px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

/* ── Sidebar ── */
.sidebar-section {
  border-bottom: 1px solid var(--border);
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
}

.sidebar-actions {
  display: flex;
  gap: 2px;
}

.sidebar-actions button.icon-btn {
  padding: 2px 4px;
}
.sidebar-actions button.icon-btn svg { width: 14px; height: 14px; }

/* ── File search ── */
#file-search-box {
  padding: 4px 10px;
  display: none;
}
#file-search-box.open { display: block; }
#file-search-input {
  width: 100%;
  padding: 4px 8px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font);
  outline: none;
}
#file-search-input:focus { border-color: var(--accent); }

#file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0;
}

.tree-dir {
  user-select: none;
}
.tree-dir-header {
  padding: 4px 14px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  font-weight: 500;
  transition: all 0.1s;
}
.tree-dir-header:hover { background: var(--bg-hover); }
.tree-dir-header .arrow {
  display: inline-flex;
  align-items: center;
  width: 14px;
  color: var(--text-dim);
  transition: transform 0.15s;
}
.tree-dir-header .arrow svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.tree-dir-header .arrow.open { transform: rotate(90deg); }
.tree-dir-children {
  display: none;
}
.tree-dir-children.open {
  display: block;
}

.file-item {
  padding: 4px 14px 4px 18px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  transition: all 0.1s;
  font-family: var(--mono);
}
.file-item:hover { background: var(--bg-hover); }
.file-item.active {
  background: var(--bg-hover);
  color: var(--accent);
  font-weight: 500;
}
.file-item.modified::after {
  content: " \u25CF";
  color: var(--orange);
  font-size: 10px;
}
.file-item.artifact {
  opacity: 0.45;
  font-style: italic;
}

/* ── Sidebar tabs ── */
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-tab {
  flex: 1; padding: 7px 0; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; background: none; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; color: var(--text-dim); transition: color 0.15s;
}
.sidebar-tab:hover { color: var(--text); }
.sidebar-tab.active { color: var(--text); border-bottom-color: var(--accent); }

#sidebar-files { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
#sidebar-git { display: none; flex-direction: column; flex: 1; overflow: hidden; }

/* ── Git panel ── */
.git-file {
  padding: 3px 10px 3px 10px;
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--mono);
  cursor: pointer; display: flex; align-items: center; gap: 4px;
}
.git-status {
  min-width: 26px;
  padding-right: 4px;
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
  text-align: center;
}
.git-status.M { color: var(--orange); }
.git-status.A, .git-status.U { color: var(--green); }
.git-status.D { color: var(--red); }
.git-file:hover { background: var(--bg-hover); }
.git-file.active { background: var(--bg-hover); }
.git-file input[type="checkbox"] { margin: 0; cursor: pointer; flex-shrink: 0; }
.git-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
#git-files { flex: 1; overflow-y: auto; }
#git-diff-view {
  flex: 1; min-height: 0;
  overflow: auto;
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  padding: 4px 8px;
  white-space: pre;
  background: var(--bg);
}
.diff-add { color: var(--green); }
.diff-del { color: var(--red); }
.diff-hunk { color: var(--accent); font-weight: 500; }
#git-commit-area {
  flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
}
#git-commit-msg {
  width: 100%; resize: vertical; min-height: 40px; max-height: 120px;
  padding: 6px 8px; font-size: 12px; font-family: var(--font);
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; outline: none; box-sizing: border-box;
}
#git-commit-msg:focus { border-color: var(--accent); }
#git-commit-btns { display: flex; gap: 6px; }
#git-commit-btns button { flex: 1; }

/* ── Editor ── */
#editor-container { flex: 1; overflow: hidden; }
#editor-container .cm-editor { height: 100%; }
#editor-container .cm-editor .cm-scroller {
  overflow: auto;
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
}
#editor-container .cm-editor .cm-gutters {
  background: var(--bg-card);
  color: var(--text-dim);
  border-right: 1px solid var(--border);
}
#editor-container .cm-editor .cm-activeLine { background: var(--bg-hover); }
#editor-container .cm-editor .cm-activeLineGutter { background: var(--bg-hover); }
#editor-container .cm-editor .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 20%, transparent); }
#editor-container .cm-editor .cm-cursor { border-left-color: var(--accent); }
#editor-container .cm-editor { background: var(--bg); }

/* ── PDF Viewer ── */
#pdf-container {
  flex: 1;
  overflow: auto;
  background: color-mix(in srgb, var(--bg) 80%, #525252);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 16px;
}
#pdf-container canvas { box-shadow: 0 2px 12px rgba(0,0,0,0.15); border-radius: 2px; }
#btn-pdf-hd.active { background: var(--accent); color: #fff; }

#pdf-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.pdf-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 14px;
}

/* ── Compile Log ── */
#log-panel {
  height: 0;
  overflow: hidden;
  transition: height 0.2s;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#log-panel.open { height: 200px; }

#log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 14px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

#log-content {
  height: calc(100% - 30px);
  overflow-y: auto;
  padding: 6px 14px;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  background: var(--bg);
}

.log-line { padding: 1px 0; }
.log-line.error { color: var(--red); }
.log-line.warning { color: var(--orange); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  min-width: 380px;
  max-width: 540px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.modal h3 { margin-bottom: 16px; font-size: 16px; }
.modal input[type="text"], .modal input[type="number"], .modal textarea {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 14px;
  margin-bottom: 14px;
}
.modal input[type="text"]:focus, .modal input[type="number"]:focus, .modal textarea:focus {
  border-color: var(--accent);
  outline: none;
}
.modal textarea { resize: vertical; min-height: 60px; font-family: var(--mono); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Project List (multi-project mode) ── */
#project-list-view {
  display: none;
  flex: 1;
  padding: 48px;
  overflow-y: auto;
}
.project-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.project-header h1 { font-size: 24px; margin: 0; }
.project-toolbar { display: flex; align-items: center; gap: 8px; }
#project-search {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; width: 200px; background: var(--bg); color: var(--text);
}
#project-search:focus { border-color: var(--accent); outline: none; }
.view-toggle { font-size: 16px; padding: 4px 8px; border-radius: 4px; background: none; border: 1px solid transparent; cursor: pointer; color: var(--text-dim); }
.view-toggle.active { color: var(--accent); background: var(--bg-hover); border-color: var(--border); }

.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.project-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.project-card h3 { font-size: 16px; margin-bottom: 6px; }
.project-card .meta { font-size: 12px; color: var(--text-dim); }
.project-card .project-path { font-size: 12px; color: var(--text-dim); font-family: var(--mono); word-break: break-all; margin-top: 4px; }
.project-card.stale { opacity: 0.5; border-style: dashed; }
.project-card.stale .project-path::after { content: " (missing)"; color: var(--red); font-family: var(--font); }
.project-card .remove-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  padding: 4px; border-radius: 4px; display: none; line-height: 0;
}
.project-card .remove-btn:hover { color: var(--red); background: var(--bg-hover); }
.project-card .rename-btn {
  position: absolute; top: 8px; right: 32px;
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  padding: 4px; border-radius: 4px; display: none; line-height: 0;
}
.project-card .rename-btn:hover { color: var(--accent); background: var(--bg-hover); }
.project-card:hover .remove-btn, .project-card:hover .rename-btn { display: block; }
.project-card .project-time { display: none; font-size: 12px; color: var(--text-dim); }
.project-card .git-badge { color: var(--text-dim); line-height: 0; vertical-align: middle; margin-left: 4px; }
.project-card:hover .git-badge { color: var(--accent); }

/* List view */
.project-grid.list-view { grid-template-columns: 1fr; gap: 2px; }
.project-grid.list-view .project-card {
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  border-radius: 4px; border-color: transparent; background: none;
}
.project-grid.list-view .project-card:hover { background: var(--bg-hover); border-color: transparent; box-shadow: none; }
.project-grid.list-view .project-card h3 { margin-bottom: 0; font-size: 14px; min-width: 160px; flex-shrink: 0; }
.project-grid.list-view .project-card .project-path { margin-top: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-grid.list-view .project-card .project-time { display: inline; flex-shrink: 0; text-align: right; }
.project-grid.list-view .project-card .git-badge { flex-shrink: 0; }
.project-grid.list-view .project-card .rename-btn { top: 50%; right: 28px; transform: translateY(-50%); }
.project-grid.list-view .project-card .remove-btn { top: 50%; transform: translateY(-50%); }
.project-grid.list-view .project-card:hover .project-time { display: none !important; }

/* ── Directory Browser ── */
.dir-browser { margin-bottom: 14px; }
.dir-browser .dir-path {
  font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  padding: 6px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0; word-break: break-all;
}
.dir-browser .dir-list {
  max-height: 240px; overflow-y: auto;
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}
.dir-browser .dir-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; cursor: pointer; font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.dir-browser .dir-item:last-child { border-bottom: none; }
.dir-browser .dir-item:hover { background: var(--bg-hover); }
.dir-browser .dir-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.dir-browser .dir-item.parent-dir { font-weight: 600; color: var(--text-dim); }

/* ── Editor View ── */
#editor-view {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

/* ── Settings popup (centered modal) ── */
.settings-popup {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.settings-popup.open { display: flex; }
.settings-popup-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  min-width: 340px;
  max-width: 440px;
  padding: 24px;
}
.settings-popup-panel h3 {
  margin-bottom: 16px;
  font-size: 16px;
  font-weight: 600;
}
.settings-popup-item {
  padding: 8px 0;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.settings-popup-item label {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 80px;
}
.settings-popup-item select, .settings-popup-item input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 4px 8px;
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono);
}
.settings-popup-item input[type="checkbox"] { cursor: pointer; margin-left: auto; }
.settings-divider { border-top: 1px solid var(--border); margin: 6px 0; }
.settings-collapsible {
  max-height: 50px;
  overflow: hidden;
  opacity: 1;
  transition: max-height 0.2s ease, opacity 0.15s ease;
}
.settings-collapsible.collapsed {
  max-height: 0;
  opacity: 0;
}

/* ── Shortcuts popup ── */
.shortcuts-popup {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.shortcuts-popup.open { display: flex; }
.shortcuts-popup-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  min-width: 380px;
  max-width: 480px;
  padding: 24px;
}
.shortcuts-popup-panel h3 {
  margin-bottom: 16px;
  font-size: 16px;
  font-weight: 600;
}
.shortcut-group { margin-bottom: 14px; }
.shortcut-group-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.shortcut-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}
.shortcut-row .shortcut-desc { color: var(--text); }
.shortcut-row kbd {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  font-family: var(--mono);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  line-height: 1.4;
  min-width: 20px;
  text-align: center;
}
.shortcut-row .shortcut-keys { display: flex; gap: 3px; align-items: center; }
.shortcut-row .shortcut-keys span { font-size: 10px; color: var(--text-dim); }

/* ── About popup links ── */
.about-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: background 0.15s, border-color 0.15s;
}
.about-link:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }

/* ── Context menu ── */
.context-menu {
  display: none;
  position: fixed;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  min-width: 160px;
  z-index: 300;
  padding: 4px 0;
}
.context-menu.open { display: block; }
.context-menu-item {
  padding: 6px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.1s;
}
.context-menu-item:hover { background: var(--bg-hover); }
.context-menu-item.danger { color: var(--red); }
.context-menu-sep {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* ── Badge ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 11px;
}
.badge.success { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.badge.error { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.badge.info { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }

/* ── Loading overlay ── */
#loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  font-size: 16px;
  color: var(--text-dim);
  transition: opacity 0.3s;
}
#loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Prevent layout shift: hide app until ready */
#app { visibility: hidden; }
#app.ready { visibility: visible; }

/* ── Hidden file upload input ── */
#file-upload-input { display: none; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div id="loading-overlay">Loading Tinyleaf...</div>

<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <span class="toolbar-brand" id="btn-home" style="cursor:pointer">Tinyleaf</span>
    <span id="toolbar-project-name" style="display:none;align-items:center;gap:8px">
    <span class="toolbar-sep"></span>
    <span id="project-name" style="font-size: 13px; color: var(--text-dim);">&mdash;</span>
    </span>
    <span style="flex:1"></span>

    <span id="toolbar-project" style="display:none;align-items:center;gap:8px">
    <select id="main-file-select" title="Main file" data-i18n-title="main_file"></select>
    <select id="engine-select" title="Engine" data-i18n-title="engine">
      <option value="latexmk" selected>latexmk</option>
      <option value="pdflatex">pdflatex</option>
      <option value="lualatex">lualatex</option>
      <option value="xelatex">xelatex</option>
    </select>
    <label id="auto-compile-label" style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-dim);cursor:pointer" title="Auto compile on save" data-i18n-title="auto_compile_title">
      <input type="checkbox" id="auto-compile-toggle" style="cursor:pointer" checked>
      <span data-i18n="auto_compile">Auto</span>
    </label>
    <button id="btn-compile" class="primary" data-i18n="compile">Compile</button>
    <button id="btn-clean" class="sm danger" data-i18n="clean" title="Remove build artifacts" data-i18n-title="clean_title">Clean</button>
    <span class="toolbar-sep"></span>
    <button id="btn-save" class="sm" data-i18n="save">Save</button>
    <button id="btn-commit" class="sm" data-i18n="commit">Commit</button>
    <button id="btn-push" class="sm" data-i18n="push">Push</button>
    <span class="toolbar-sep"></span>
    <button class="icon-btn" id="btn-log-toggle" title="Toggle log" data-i18n-title="toggle_log"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
    </span>
  </div>

  <div id="main">
    <!-- Project List View -->
    <div id="project-list-view">
      <div class="project-header">
        <h1 data-i18n="projects">Projects</h1>
        <div class="project-toolbar">
          <input type="text" id="project-search" data-i18n-placeholder="search_projects" placeholder="Search projects...">
          <button class="sm" id="btn-open-folder" style="font-size:12px"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" style="vertical-align:-2px"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg> <span data-i18n="open_folder">Open Folder</span></button>
          <button class="sm primary" id="btn-new-project" style="font-size:12px"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" style="vertical-align:-2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> <span data-i18n="new_project">New Project</span></button>
          <button class="view-toggle active" id="btn-view-grid" title="Grid view" data-i18n-title="grid_view"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
          <button class="view-toggle" id="btn-view-list" title="List view" data-i18n-title="list_view"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </div>
      <div id="project-grid" class="project-grid"></div>
    </div>

    <!-- Editor View -->
    <div id="editor-view">
      <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- Sidebar -->
        <div id="sidebar">
          <div class="sidebar-tabs">
            <button class="sidebar-tab active" data-tab="files" data-i18n="files" id="tab-files">Files</button>
            <button class="sidebar-tab" data-tab="git" id="tab-git">Git</button>
          </div>
          <div id="sidebar-files">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span data-i18n="files">Files</span>
              <div class="sidebar-actions">
                <button class="icon-btn" id="btn-collapse-all" title="Collapse all" data-i18n-title="collapse_all"><svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
                <button class="icon-btn" id="btn-search-file" title="Search files" data-i18n-title="search_files_title"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="icon-btn" id="btn-upload-file" title="Upload file" data-i18n-title="upload_file_title"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
                <button class="icon-btn" id="btn-new-folder" title="New folder" data-i18n-title="new_folder_title"><svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg></button>
                <button class="icon-btn" id="btn-new-file" title="New file" data-i18n-title="new_file_title"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
              </div>
            </div>
            <div id="file-search-box">
              <input type="text" id="file-search-input" placeholder="Search files..." data-i18n="search_files">
            </div>
            <div id="file-tree"></div>
          </div>
          </div>
          <div id="sidebar-git">
            <div class="sidebar-header">
              <span id="git-branch">Git</span>
              <span style="flex:1"></span>
              <button class="sm" id="btn-git-refresh" style="font-size:10px;padding:1px 6px" title="Refresh" data-i18n-title="refresh">&#x21bb;</button>
            </div>
            <div id="git-files"></div>
            <div id="git-diff-view" style="display:none"></div>
            <div id="git-commit-area">
              <textarea id="git-commit-msg" placeholder="Commit message..." data-i18n-placeholder="commit_message" rows="2"></textarea>
              <div id="git-commit-btns">
                <button class="sm primary" id="btn-git-commit-selected" data-i18n="commit">Commit</button>
                <button class="sm" id="btn-git-push" data-i18n="push">Push</button>
              </div>
            </div>
          </div>
        </div>

        <div class="resize-handle" id="resize-sidebar"></div>

        <!-- Workspace -->
        <div id="workspace">
          <div id="editor-pane">
            <div id="editor-breadcrumb">
              <span id="breadcrumb-path">—</span>
              <button class="icon-btn" id="btn-locate-file" title="Locate in tree" data-i18n-title="locate_in_tree"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2"/><line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2"/><line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/></svg></button>
            </div>
            <div id="editor-container"></div>
          </div>
          <div class="resize-handle" id="resize-pdf"></div>
          <div id="pdf-pane">
            <div id="pdf-toolbar">
              <span id="pdf-status" data-i18n="no_pdf">No PDF</span>
              <span style="flex:1"></span>
              <button class="sm" id="btn-pdf-zoom-out" title="Zoom out" data-i18n-title="zoom_out">−</button>
              <span id="pdf-zoom-level" style="min-width:40px;text-align:center;font-size:11px">100%</span>
              <button class="sm" id="btn-pdf-zoom-in" title="Zoom in" data-i18n-title="zoom_in">+</button>
              <button class="sm" id="btn-pdf-zoom-fit" title="Fit width" data-i18n-title="fit_width" data-i18n="fit">Fit</button>
              <span class="toolbar-sep"></span>
              <button class="sm" id="btn-pdf-hd" title="Toggle HD/Fast" data-i18n-title="toggle_hd">HD</button>
              <span class="toolbar-sep"></span>
              <button class="sm" id="btn-pdf-refresh" data-i18n="refresh">Refresh</button>
            </div>
            <div id="pdf-container">
              <div class="pdf-placeholder" data-i18n="compile_to_preview">Compile to see PDF preview</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Compile Log -->
      <div id="log-panel">
        <div id="log-header">
          <span data-i18n="compile_log">Compile Log</span>
          <span id="log-status"></span>
          <span style="flex:1"></span>
          <button id="btn-log-copy" class="sm" style="font-size:11px;padding:2px 8px" title="Copy log" data-i18n-title="copy_log" data-i18n="copy" onclick="event.stopPropagation(); copyLog()">Copy</button>
        </div>
        <div id="log-content"></div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span id="status-left" data-i18n="ready">Ready</span>
    <span style="flex:1"></span>
    <span id="status-right"></span>
    <button class="icon-btn" id="btn-about" title="About" data-i18n-title="about" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
    <button class="icon-btn" id="btn-shortcuts" title="Keyboard shortcuts" data-i18n-title="keyboard_shortcuts" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="14" y2="12"/><line x1="18" y1="12" x2="18" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/></svg></button>
    <button class="icon-btn" id="btn-settings" title="Settings" data-i18n-title="settings" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</div>

<!-- Settings popup (centered modal) -->

      <label data-i18n="theme">Theme</label>
      <select id="theme-select"></select>
    </div>
    <div class="settings-popup-item">
      <label data-i18n="language">Language</label>

        <option value="zh">中文</option>

    </div>

    <div class="settings-popup-item">
      <label data-i18n="http_proxy">HTTP Proxy</label>
      <input id="proxy-input" type="text" placeholder="http://localhost:7890">
    </div>
    <div class="settings-popup-item">
      <label data-i18n="js_modules">JS Modules</label>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <span id="vendor-status" style="font-size:12px;color:var(--text-dim)">—</span>
        <button id="btn-update-vendor" class="sm" style="font-size:11px;padding:2px 8px" data-i18n="update">Update</button>
      </div>
    </div>
  </div>
</div>

<!-- Keyboard shortcuts popup -->
<div class="shortcuts-popup" id="shortcuts-popup" onclick="this.classList.remove('open')">
  <div class="shortcuts-popup-panel" onclick="event.stopPropagation()">
    <h3 data-i18n="keyboard_shortcuts">Keyboard Shortcuts</h3>
    <div id="shortcuts-content"></div>
  </div>
</div>

<!-- About popup -->
<div class="settings-popup" id="about-popup" onclick="this.classList.remove('open')">
  <div class="settings-popup-panel" onclick="event.stopPropagation()" style="text-align:center;min-width:300px;max-width:360px">
    <h3 style="margin-bottom:8px;font-size:20px">Tinyleaf</h3>
    <div id="about-version" style="font-size:12px;color:var(--text-dim);margin-bottom:16px"></div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px" data-i18n="about_desc">A lightweight web-based LaTeX editor</div>

let currentLang = localStorage.getItem("tinyleaf-lang") || (navigator.language?.startsWith("zh") ? "zh" : "en");

function t(key) { return I18N[currentLang]?.[key] || I18N.en[key] || key; }

function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const val = t(key);
    if (el.tagName === "INPUT") el.placeholder = val;
    else el.textContent = val;
  });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => {
    el.title = t(el.getAttribute("data-i18n-title"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("tinyleaf-lang", lang);
  document.getElementById("lang-select").value = lang;
  applyI18n();
}

let currentTheme = localStorage.getItem("tinyleaf-theme") || "light";

function setTheme(name) {
  const vars = THEMES[name];
  if (!vars) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
  currentTheme = name;
  localStorage.setItem("tinyleaf-theme", name);
  document.getElementById("theme-select").value = name;
}

function initThemeSelect() {
  const sel = document.getElementById("theme-select");
  for (const name of Object.keys(THEMES)) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name.charAt(0).toUpperCase() + name.slice(1).replace("-", " ");
    sel.appendChild(opt);
  }
  sel.value = currentTheme;
  sel.onchange = () => setTheme(sel.value);
}

// Module loader: local vendor first, CDN fallback
// ══════════════════════════════════════════
const VENDOR = "/vendor/";
const CDN = "https://cdn.jsdelivr.net/npm/";

async function loadMod(localFile, cdnPath) {
  try { return await import(VENDOR + localFile); }
  catch { return await import(CDN + cdnPath); }
}

// ── PDF.js ──
const pdfjsLib = await loadMod("pdfjs.js", "pdfjs-dist@4.9.155/build/pdf.min.mjs");
{
  let workerSrc = CDN + "pdfjs-dist@4.9.155/build/pdf.worker.min.mjs";
  try {
    const r = await fetch(VENDOR + "pdfjs-worker.js", { method: "HEAD" });
    if (r.ok) workerSrc = VENDOR + "pdfjs-worker.js";
  } catch {}
  pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;
}

  { closeBrackets, closeBracketsKeymap, autocompletion },

  loadMod("cm-view.js", "@codemirror/view@6/+esm"),

// LaTeX build artifact extensions (grayed out in file tree)
const ARTIFACT_EXTS = new Set([
  ".aux", ".bbl", ".bcf", ".blg", ".fdb_latexmk", ".fls", ".log", ".out",
  ".run.xml", ".synctex.gz", ".toc", ".lof", ".lot", ".nav", ".snm", ".vrb",
  ".xdv", ".idx", ".ilg", ".ind", ".glo", ".gls", ".ist",
]);
function isArtifact(name) {
  if (name.endsWith(".synctex.gz")) return true;
  const dot = name.lastIndexOf(".");
  return dot >= 0 && ARTIFACT_EXTS.has(name.slice(dot));
}

  ".cfg": { mod: "cm-lang-yaml.js", cdn: "@codemirror/lang-yaml@6/+esm", fn: "yaml" },
  ".conf": { mod: "cm-lang-yaml.js", cdn: "@codemirror/lang-yaml@6/+esm", fn: "yaml" },
};
// Filename-based language mappings (no extension)
const LANG_NAME_MAP = {
  "Makefile": { mod: "cm-lang-python.js", cdn: "@codemirror/lang-python@6/+esm", fn: "python" },
  "Dockerfile": { mod: "cm-lang-yaml.js", cdn: "@codemirror/lang-yaml@6/+esm", fn: "yaml" },
  ".gitignore": { mod: "cm-lang-yaml.js", cdn: "@codemirror/lang-yaml@6/+esm", fn: "yaml" },
  ".dockerignore": { mod: "cm-lang-yaml.js", cdn: "@codemirror/lang-yaml@6/+esm", fn: "yaml" },
};
const _langCache = {};
async function getLangExtension(filePath) {
  const fileName = filePath.split("/").pop();
  const ext = filePath.includes(".") ? "." + filePath.split(".").pop().toLowerCase() : "";
  const spec = LANG_MAP[ext] || LANG_NAME_MAP[fileName];
  if (!spec) return null;
  const key = spec.mod;
  if (!_langCache[key]) {
    try { _langCache[key] = await loadMod(spec.mod, spec.cdn); }
    catch { _langCache[key] = null; }
  }
  const mod = _langCache[key];
  return mod?.[spec.fn]?.() || null;
}

// ── API ──
async function api(method, path, body = null) {
  const opts = { method, headers: {} };
  if (body !== null) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opts);
  const ct = resp.headers.get("content-type") || "";
  if (ct.includes("application/json")) {
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    return data;
  }
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp;
}

function enc(s) { return encodeURIComponent(s); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function setStatus(msg, level = "info") {
  const el = document.getElementById("status-left");
  el.textContent = msg;
  el.style.color = level === "error" ? "var(--red)" : level === "warning" ? "var(--orange)" : level === "success" ? "var(--green)" : "";
}

async function init() {
  initThemeSelect();
  setTheme(currentTheme);
  setLang(currentLang);

  const info = await api("GET", "/api/mode");
  S.mode = info.mode;
  S.useDocker = info.docker;
  S.dockerImage = info.image || "oaklight/texlive:alpine-science-cn";
  document.getElementById("about-version").textContent = `v${info.version || "0.0.0"}`;

  // Always load docker images list and sync toggle
  document.getElementById("docker-toggle").checked = S.useDocker;
  document.getElementById("docker-image-row").classList.toggle("collapsed", !S.useDocker);

  // Load global settings (show_debian, etc.)
  try {
    const globalSettings = await api("GET", "/api/settings");
    document.getElementById("show-debian-toggle").checked = !!globalSettings.show_debian;
    if (globalSettings.registry_mirror) {
      document.getElementById("registry-mirror-input").value = globalSettings.registry_mirror;
    } else {
      // Auto-detect China region and suggest registry mirror
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      const isCN = tz.startsWith("Asia/Shanghai") || tz.startsWith("Asia/Chongqing")
        || tz.startsWith("Asia/Harbin") || tz.startsWith("Asia/Urumqi")
        || navigator.language?.startsWith("zh");
      if (isCN) {
        const mirror = "docker.1ms.run";
        document.getElementById("registry-mirror-input").value = mirror;
        api("PUT", "/api/settings", { registry_mirror: mirror });
      }
    }
  } catch {}
  await loadDockerImages();

  if (S.mode === "multi") {
    const lastProject = localStorage.getItem("tinyleaf-project");
    const projects = await api("GET", "/api/projects");
    const names = projects.map(p => p.name);
    if (lastProject && names.includes(lastProject)) {
      await openProject(lastProject);
    } else {
      showProjectList();
    }
  } else {
    const projects = await api("GET", "/api/projects");
    if (projects.length > 0) openProject(projects[0].name);
  }

  setupKeybindings();
  setupSettingsPopup();
  setupFileSearch();
  setupUpload();
  startFileWatcher();
  setStatus(t("ready"));

  // Reveal UI
  document.getElementById("app").classList.add("ready");
  const overlay = document.getElementById("loading-overlay");
  overlay.classList.add("hidden");
  setTimeout(() => overlay.remove(), 300);
}

  };

  document.getElementById("docker-toggle").onchange = (e) => {
    S.useDocker = e.target.checked;
    document.getElementById("docker-image-row").classList.toggle("collapsed", !S.useDocker);
    if (S.projectName) {
      api("PUT", `/api/projects/${enc(S.projectName)}/config`, { use_docker: S.useDocker });
    }
  };

  document.getElementById("docker-image-select").onchange = (e) => {
    S.dockerImage = e.target.value;
    if (S.projectName) {
      api("PUT", `/api/projects/${enc(S.projectName)}/config`, { docker_image: S.dockerImage });
    }
  };

  document.getElementById("show-debian-toggle").onchange = (e) => {
    api("PUT", "/api/settings", { show_debian: e.target.checked });
    loadDockerImages(true);
  };

  // Registry mirror — save on blur
  document.getElementById("registry-mirror-input").onblur = (e) => {
    api("PUT", "/api/settings", { registry_mirror: e.target.value.trim() });
  };

  // Docker pull
  document.getElementById("btn-docker-pull").onclick = async () => {
    const sel = document.getElementById("docker-image-select");
    const image = sel.value;
    if (!image) return;
    const btn = document.getElementById("btn-docker-pull");
    if (S.pulling) {
      // Cancel the running pull
      btn.disabled = true;
      try {
        await api("POST", "/api/docker/cancel-pull", { image: S.pullingImage });
      } catch {}
      btn.disabled = false;
      return;
    }
    S.pulling = true;
    S.pullingImage = image;
    btn.textContent = t("cancel");
    setStatus(t("pulling_image"));
    try {
      const res = await api("POST", "/api/docker/pull", { image });
      if (res.success) {
        setStatus(t("pull_success"), "success");
      } else if (res.message === "Cancelled") {
        setStatus(t("pull_cancelled"), "warning");
      } else {
        setStatus(t("pull_failed") + ": " + res.message, "error");
      }
      await loadDockerImages();
    } catch (e) {
      setStatus(t("pull_failed") + ": " + e.message, "error");
    } finally {
      S.pulling = false;
      S.pullingImage = null;
      btn.textContent = t("pull");
    }
  };

  // Docker remove
  document.getElementById("btn-docker-rmi").onclick = async () => {
    const sel = document.getElementById("docker-image-select");
    const image = sel.value;
    if (!image) return;
    const name = sel.options[sel.selectedIndex]?.textContent || image;
    if (!confirm(t("confirm_rmi").replace("{name}", image))) return;
    try {
      const res = await api("POST", "/api/docker/rmi", { image });
      if (res.success) {
        setStatus(t("image_removed"), "success");
      } else {
        setStatus(t("remove_failed") + ": " + res.message, "error");
      }
      await loadDockerImages();
    } catch (e) {
      setStatus(t("remove_failed") + ": " + e.message, "error");
    }
  };

  // Vendor JS modules status + update
  checkVendorStatus();
  document.getElementById("btn-update-vendor").onclick = async () => {
    const btn = document.getElementById("btn-update-vendor");
    const status = document.getElementById("vendor-status");
    const proxy = document.getElementById("proxy-input").value.trim();
    btn.disabled = true;
    status.textContent = t("downloading");
    try {
      await api("POST", "/api/vendor/update", { proxy });
      status.textContent = t("vendor_local") + " \u2713";
    } catch (e) {
      status.textContent = "Error: " + e.message;
    } finally {
      btn.disabled = false;
    }
  };
}

async function checkVendorStatus() {
  const el = document.getElementById("vendor-status");
  try {
    const data = await api("GET", "/api/vendor/status");
    // Load saved proxy
    if (data.proxy) document.getElementById("proxy-input").value = data.proxy;
    if (data.ready) {
      const d = data.manifest.updated_at?.slice(0, 10) || "";
      el.textContent = t("vendor_local") + (d ? ` (${d})` : "");
    } else {
      el.textContent = t("vendor_cdn");
    }
  } catch {
    el.textContent = "—";
  }
}

let _allDockerImages = [];

async function loadDockerImages(filterOnly) {
  const sel = document.getElementById("docker-image-select");
  sel.innerHTML = "";
  try {
    if (!filterOnly || !_allDockerImages.length) {
      _allDockerImages = await api("GET", "/api/docker/images");
    }
    const showDebian = document.getElementById("show-debian-toggle")?.checked;
    const images = _allDockerImages.filter(img =>
      showDebian || !img.name.startsWith("debian")
    );
    for (const img of images) {
      const opt = document.createElement("option");
      opt.value = img.tag;
      opt.textContent = img.local ? `${img.name} ✓` : img.name;
      sel.appendChild(opt);
    }
    const match = images.find(i => i.tag === S.dockerImage);
    if (match) {
      sel.value = match.tag;
    } else if (images.length > 0) {
      sel.value = images[0].tag;
      S.dockerImage = images[0].tag;
    }
  } catch {
    const opt = document.createElement("option");
    opt.value = S.dockerImage;
    opt.textContent = S.dockerImage;
    sel.appendChild(opt);
  }
}

let uploadTargetDir = "";

  const input = document.getElementById("file-upload-input");

    if (!input.files.length || !S.projectName) return;
    const formData = new FormData();
    if (uploadTargetDir) formData.append("target_dir", uploadTargetDir);
    for (const file of input.files) formData.append("file", file);

    try {
      const resp = await fetch(`/api/projects/${enc(S.projectName)}/upload`, {
        method: "POST",
        body: formData,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Upload failed");
      setStatus(t("uploaded").replace("{n}", data.count), "success");
      await refreshFiles();
    } catch (err) {
      setStatus(`Upload error: ${err.message}`, "error");

    input.value = "";
    uploadTargetDir = "";
  });
}

// ══════════════════════════════════════════
// Context Menu
// ══════════════════════════════════════════
function closeContextMenu() {
  document.getElementById("context-menu").classList.remove("open");
}

function showContextMenu(e, items) {
  e.preventDefault();
  e.stopPropagation();

  const menu = document.getElementById("context-menu");
  menu.innerHTML = "";
  for (const item of items) {
    if (item === "sep") {
      const sep = document.createElement("div");
      sep.className = "context-menu-sep";
      menu.appendChild(sep);
      continue;
    }
    const div = document.createElement("div");
    div.className = "context-menu-item" + (item.danger ? " danger" : "");
    div.textContent = item.label;
    div.onclick = () => { closeContextMenu(); item.action(); };
    menu.appendChild(div);
  }

  // Position the menu
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.classList.add("open");

  // Adjust if overflows
  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + "px";
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + "px";
  });
}

document.addEventListener("click", closeContextMenu);
document.addEventListener("contextmenu", (e) => {
  // Close any open context menu when right-clicking elsewhere
  const menu = document.getElementById("context-menu");
  if (menu.classList.contains("open") && !menu.contains(e.target)) {
    closeContextMenu();
  }
});

function fileContextMenu(e, node) {
  const items = [];
  if (node.type === "file") {
    items.push({ label: t("open"), action: () => openFile(node.path) });
    items.push("sep");
  }
  items.push({ label: t("rename"), action: () => showRenameModal(node) });

  if (node.type === "dir") {
    items.push("sep");
    items.push({ label: t("new_file_here"), action: () => showNewFileInDirModal(node.path) });
    items.push({ label: t("new_folder_here"), action: () => showNewFolderInDirModal(node.path) });
    items.push({ label: t("upload_here"), action: () => triggerUpload(node.path) });
  }

  if (node.type === "file") {
    items.push({ label: t("download"), action: () => downloadFile(node.path) });
  }

  items.push("sep");
  items.push({ label: t("delete"), danger: true, action: () => confirmDelete(node) });

  showContextMenu(e, items);
}

function showRenameModal(node) {
  const oldName = node.name;
  showModal(t("rename_title"), `<input id="inp-rename" value="${esc(oldName)}" autofocus>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("rename"), primary: true, action: async () => {
      const newName = document.getElementById("inp-rename").value.trim();
      if (!newName || newName === oldName) { closeModal(); return; }
      const parentDir = node.path.includes("/") ? node.path.substring(0, node.path.lastIndexOf("/")) : "";
      const newPath = parentDir ? parentDir + "/" + newName : newName;
      try {
        await api("POST", `/api/projects/${enc(S.projectName)}/rename`, { old_path: node.path, new_path: newPath });
        closeModal();
        setStatus(`${t("renamed")}: ${newName}`, "success");
        await refreshFiles();
        if (S.currentFile === node.path) {
          S.currentFile = newPath;
          await openFile(newPath);
        }
      } catch (err) {
        setStatus(`Rename error: ${err.message}`, "error");
      }
    }},
  ]);
  setTimeout(() => {
    const inp = document.getElementById("inp-rename");
    if (inp) { inp.focus(); inp.select(); }
  }, 50);
}

function confirmDelete(node) {
  const msg = t("confirm_delete").replace("{name}", node.name);
  showModal(t("delete"), `<p style="margin-bottom:14px">${esc(msg)}</p>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("delete"), primary: true, action: async () => {
      try {
        await api("DELETE", `/api/projects/${enc(S.projectName)}/files/${enc(node.path)}`);
        closeModal();
        setStatus(`${t("deleted")}: ${node.name}`, "success");
        if (S.currentFile === node.path) S.currentFile = null;
        await refreshFiles();
      } catch (err) {
        setStatus(`Delete error: ${err.message}`, "error");
      }
    }},
  ]);
}

function downloadFile(filePath) {
  const url = `/api/projects/${enc(S.projectName)}/files/${enc(filePath)}`;
  // Read and download via blob
  fetch(url).then(r => r.json()).then(data => {
    const blob = new Blob([data.content], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filePath.split("/").pop();
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function showNewFileInDirModal(dirPath) {
  showModal(t("new_file_title"), `<input id="inp-newfile" placeholder="${t("filename")}" autofocus>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("create"), primary: true, action: async () => {
      const fname = document.getElementById("inp-newfile").value.trim();
      if (!fname) return;
      const fullPath = dirPath ? dirPath + "/" + fname : fname;
      await api("PUT", `/api/projects/${enc(S.projectName)}/files/${enc(fullPath)}`, { content: "" });
      closeModal();
      expandedDirs.add(dirPath);
      await refreshFiles();
      await openFile(fullPath);

}

function showNewFolderInDirModal(dirPath) {

    { label: t("cancel"), action: closeModal },

      try {
        await api("POST", `/api/projects/${enc(S.projectName)}/mkdir`, { path: fullPath });
        closeModal();
        expandedDirs.add(dirPath);
        expandedDirs.add(fullPath);

      } catch (err) {
        setStatus(`Error: ${err.message}`, "error");
      }
    }},
  ]);
  setTimeout(() => document.getElementById("inp-newfolder")?.focus(), 50);
}

    const gitBadge = p.git ? `<span class="git-badge" title="Git repository"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></span>` : "";

      + `<button class="remove-btn" title="${t("remove_project")}"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    if (p.exists !== false) {

  if (searchInput) searchInput.value = "";

  document.getElementById("btn-view-list").classList.toggle("active", mode === "list");
  localStorage.setItem("tinyleaf-view-mode", mode);
}

// ── Directory Browser ──
async function loadDirBrowser(containerId, startPath) {
  const container = document.getElementById(containerId);
  const path = startPath || "~";
  const data = await api("GET", `/api/fs/browse?path=${encodeURIComponent(path)}`);
  renderDirBrowser(containerId, data.path, data.dirs);
}

function renderDirBrowser(containerId, currentPath, dirs) {
  const container = document.getElementById(containerId);
  container.innerHTML = `<div class="dir-path">${esc(currentPath)}</div><div class="dir-list"></div>`;
  const list = container.querySelector(".dir-list");

  // Auto-fill project name from path basename (Open Folder modal only)
  const nameInput = document.getElementById("inp-folder-name");
  if (nameInput) {
    const basename = currentPath.replace(/\/+$/, "").split("/").pop() || "";
    nameInput.value = basename;
  }

  // Parent directory entry
  const parentPath = currentPath.replace(/\/[^/]+\/?$/, "") || "/";
  if (currentPath !== "/") {
    const parentItem = document.createElement("div");
    parentItem.className = "dir-item parent-dir";
    parentItem.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> ..`;
    parentItem.onclick = () => navigateDir(containerId, parentPath);
    list.appendChild(parentItem);
  }

  for (const d of dirs) {
    const item = document.createElement("div");
    item.className = "dir-item";
    item.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>${esc(d)}`;
    const fullPath = currentPath === "/" ? "/" + d : currentPath + "/" + d;
    item.onclick = () => navigateDir(containerId, fullPath);
    list.appendChild(item);
  }

  if (dirs.length === 0 && currentPath === "/") {
    const empty = document.createElement("div");
    empty.className = "dir-item";
    empty.style.color = "var(--text-dim)";
    empty.textContent = "(empty)";
    list.appendChild(empty);
  }
}

async function navigateDir(containerId, path) {
  try {
    const data = await api("GET", `/api/fs/browse?path=${encodeURIComponent(path)}`);
    renderDirBrowser(containerId, data.path, data.dirs);
  } catch (err) {
    setStatus(`Error: ${err.message}`, "error");
  }
}

// ══════════════════════════════════════════
// Open Project
// ══════════════════════════════════════════
async function openProject(name) {
  S.projectName = name;
  localStorage.setItem("tinyleaf-project", name);
  document.getElementById("project-name").textContent = name;
  document.getElementById("project-list-view").style.display = "none";
  document.getElementById("editor-view").style.display = "flex";
  document.getElementById("toolbar-project").style.display = "flex";
  document.getElementById("toolbar-project-name").style.display = "flex";

  // Clear previous project state
  S.pdfDoc = null;
  const pdfContainer = document.getElementById("pdf-container");
  pdfContainer.innerHTML = `<div class="pdf-placeholder" data-i18n="compile_to_preview">${t("compile_to_preview")}</div>`;
  document.getElementById("pdf-status").textContent = t("no_pdf");

  const config = await api("GET", `/api/projects/${enc(name)}/config`);
  document.getElementById("engine-select").value = config.engine || "latexmk";

  // Sync auto-compile toggle with project config
  S.autoCompile = config.auto_compile !== false; // default true
  document.getElementById("auto-compile-toggle").checked = S.autoCompile;

  // Sync docker toggle with project config
  if ("use_docker" in config) {
    S.useDocker = config.use_docker;
    document.getElementById("docker-toggle").checked = S.useDocker;
    document.getElementById("docker-image-row").classList.toggle("collapsed", !S.useDocker);
  }
  if (config.docker_image) {
    S.dockerImage = config.docker_image;
    document.getElementById("docker-image-select").value = S.dockerImage;
  }

  await refreshFiles();

  // Populate main file selector
  S.mainFile = config.main_file || _detectMainFile();
  _populateMainFileSelect();

  if (S.files.includes(S.mainFile)) await openFile(S.mainFile);
  else if (S.files.length > 0) await openFile(S.files[0]);

  await refreshGit();

  // Try loading existing PDF
  const pdfName = S.mainFile.replace(/\.tex$/, ".pdf");
  try {
    const r = await fetch(`/api/projects/${enc(name)}/output/${enc(pdfName)}`);
    if (r.ok) loadPDF(`/api/projects/${enc(name)}/output/${enc(pdfName)}`);
  } catch {}
}

// ══════════════════════════════════════════
// File Tree
// ══════════════════════════════════════════
async function refreshFiles() {
  S.fileTree = await api("GET", `/api/projects/${enc(S.projectName)}/files`);
  // Flatten for quick lookups
  S.files = [];
  function collect(nodes) {
    for (const n of nodes) {
      if (n.type === "file") S.files.push(n.path);
      else if (n.children) collect(n.children);
    }
  }
  collect(S.fileTree);
  renderFileTree();
  _populateMainFileSelect();
}

function _detectMainFile() {
  const texFiles = S.files.filter((f) => f.endsWith(".tex"));
  if (texFiles.includes("main.tex")) return "main.tex";
  // Prefer root-level .tex files with \documentclass (server already detects this)
  const rootTex = texFiles.filter((f) => !f.includes("/"));
  if (rootTex.length > 0) return rootTex[0];
  return texFiles[0] || "main.tex";
}

function _populateMainFileSelect() {
  const sel = document.getElementById("main-file-select");
  const texFiles = S.files.filter((f) => f.endsWith(".tex"));
  sel.innerHTML = "";
  for (const f of texFiles) {
    const opt = document.createElement("option");
    opt.value = f;
    opt.textContent = f;
    sel.appendChild(opt);
  }
  if (texFiles.includes(S.mainFile)) {
    sel.value = S.mainFile;
  } else if (texFiles.length > 0) {
    S.mainFile = texFiles[0];
    sel.value = S.mainFile;
  }
}

// Track which dirs are expanded (persisted to localStorage)
const expandedDirs = new Set(
  JSON.parse(localStorage.getItem("tinyleaf-expanded-dirs") || "[]")
);
function saveExpandedDirs() {
  localStorage.setItem("tinyleaf-expanded-dirs", JSON.stringify([...expandedDirs]));
}

function renderFileTree(searchFilter = "") {
  const container = document.getElementById("file-tree");
  container.innerHTML = "";
  if (searchFilter) {
    renderFilteredFiles(searchFilter, container);
  } else {
    renderTreeNodes(S.fileTree || [], container, 0);
  }
}

function renderFilteredFiles(query, parent) {
  for (const filePath of S.files) {
    if (!filePath.toLowerCase().includes(query)) continue;
    const name = filePath.split("/").pop();
    const div = document.createElement("div");
    div.className = "file-item" + (filePath === S.currentFile ? " active" : "") +
      (isArtifact(name) ? " artifact" : "");
    div.textContent = filePath;
    div.title = filePath;
    div.onclick = () => openFile(filePath);
    parent.appendChild(div);
  }
}

function renderTreeNodes(nodes, parent, depth) {
  for (const node of nodes) {
    if (node.name === ".tinyleaf.json") continue;

    if (node.type === "dir") {
      const dirEl = document.createElement("div");
      dirEl.className = "tree-dir";

      const header = document.createElement("div");
      header.className = "tree-dir-header";
      header.style.paddingLeft = (14 + depth * 16) + "px";

      const isOpen = expandedDirs.has(node.path);
      header.innerHTML = `<span class="arrow ${isOpen ? "open" : ""}"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span> ${esc(node.name)}`;
      header.onclick = () => {
        if (expandedDirs.has(node.path)) expandedDirs.delete(node.path);
        else expandedDirs.add(node.path);
        saveExpandedDirs();
        renderFileTree();
      };
      header.oncontextmenu = (e) => fileContextMenu(e, node);
      dirEl.appendChild(header);

      const childrenEl = document.createElement("div");
      childrenEl.className = "tree-dir-children" + (isOpen ? " open" : "");
      renderTreeNodes(node.children || [], childrenEl, depth + 1);
      dirEl.appendChild(childrenEl);

      parent.appendChild(dirEl);
    } else {
      const div = document.createElement("div");
      div.className = "file-item" +
        (node.path === S.currentFile ? " active" : "") +
        (S.modified.has(node.path) ? " modified" : "") +
        (isArtifact(node.name) ? " artifact" : "");
      div.style.paddingLeft = (18 + depth * 16) + "px";
      div.textContent = node.name;
      div.title = node.path;
      div.onclick = () => openFile(node.path);
      div.oncontextmenu = (e) => fileContextMenu(e, node);
      parent.appendChild(div);
    }
  }
}

function locateInTree() {
  if (!S.currentFile) return;
  // Expand all parent directories of the current file
  const parts = S.currentFile.split("/");
  for (let i = 1; i < parts.length; i++) {
    expandedDirs.add(parts.slice(0, i).join("/"));
  }
  saveExpandedDirs();
  renderFileTree();
  // Scroll the active item into view after DOM update
  setTimeout(() => {
    const active = document.querySelector("#file-tree .file-item.active");
    if (active) {
      active.scrollIntoView({ block: "center", behavior: "smooth" });
      // Brief flash effect
      active.style.outline = "2px solid var(--accent)";
      setTimeout(() => { active.style.outline = ""; }, 1000);
    }
  }, 50);
}

// ══════════════════════════════════════════
// Editor
// ══════════════════════════════════════════
async function openFile(filePath) {
  if (S.currentFile && S.modified.has(S.currentFile)) await saveCurrentFile();

  // PDF files: load in preview panel instead of editor
  if (filePath.endsWith(".pdf")) {
    const url = `/api/projects/${enc(S.projectName)}/output/${enc(filePath)}`;
    loadPDF(url);
    return;
  }

  // Image files: show in preview panel
  const imgExts = [".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".bmp", ".ico"];
  if (imgExts.some(e => filePath.toLowerCase().endsWith(e))) {
    const url = `/api/projects/${enc(S.projectName)}/output/${enc(filePath)}`;
    showImagePreview(url, filePath);
    return;
  }

  // Binary / unsupported files: show notice instead of opening
  const binExts = [".zip", ".tar", ".gz", ".bz2", ".xz", ".7z", ".rar",
    ".exe", ".dll", ".so", ".dylib", ".o", ".a",
    ".woff", ".woff2", ".ttf", ".otf", ".eot",
    ".mp3", ".mp4", ".avi", ".mov", ".wav", ".flac",
    ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx"];
  if (binExts.some(e => filePath.toLowerCase().endsWith(e))) {
    setStatus(t("binary_not_supported"), "warning");
    return;
  }

  const data = await api("GET", `/api/projects/${enc(S.projectName)}/files/${enc(filePath)}`);
  S.currentFile = filePath;
  S.fileMtime = data.mtime || 0;
  document.getElementById("breadcrumb-path").textContent = filePath;
  document.getElementById("breadcrumb-path").title = filePath;
  document.getElementById("reload-bar")?.remove();

  if (S.editorView) S.editorView.destroy();

  const extensions = [
    lineNumbers(),
    highlightActiveLine(),
    highlightActiveLineGutter(),
    drawSelection(),
    history(),
    bracketMatching(),
    closeBrackets(),
    foldGutter(),
    autocompletion(),
    search(),
    highlightSelectionMatches(),
    syntaxHighlighting(defaultHighlightStyle),
    keymap.of([
      ...defaultKeymap, ...historyKeymap, ...closeBracketsKeymap,
      ...foldKeymap, ...searchKeymap, indentWithTab,
    ]),
    EditorView.updateListener.of((update) => {
      if (update.docChanged) {
        S.modified.add(S.currentFile);
        renderFileTree();
        scheduleAutoSave();
      }
    }),
    EditorView.lineWrapping,
  ];
  const langExt = await getLangExtension(S.currentFile);
  if (langExt) extensions.push(langExt);

  S.editorView = new EditorView({
    state: EditorState.create({ doc: data.content, extensions }),
    parent: document.getElementById("editor-container"),
  });
  renderFileTree();
}

function scheduleAutoSave() {
  if (S.autoSaveInterval <= 0) return;
  if (S.autoSaveTimer) clearTimeout(S.autoSaveTimer);
  S.autoSaveTimer = setTimeout(() => saveCurrentFile(), S.autoSaveInterval);
}

async function saveCurrentFile() {
  if (!S.currentFile || !S.editorView) return;
  const content = S.editorView.state.doc.toString();
  await api("PUT", `/api/projects/${enc(S.projectName)}/files/${enc(S.currentFile)}`, { content });
  S.modified.delete(S.currentFile);
  renderFileTree();
  setStatus(`${t("saved")} ${S.currentFile}`, "success");
  // Auto-compile after save (guard against re-entry from compile's own save)
  if (S.autoCompile && !S.compiling && !S._autoCompiling) {
    clearTimeout(S.autoCompileTimer);
    S.autoCompileTimer = setTimeout(() => {
      S._autoCompiling = true;
      compile().finally(() => { S._autoCompiling = false; });
    }, 500);
  }
}

// ══════════════════════════════════════════
// File Change Detection
// ══════════════════════════════════════════
let _checkTimer = null;

async function checkFileChanges() {
  if (!S.projectName || !S.currentFile) return;
  // Check current file mtime
  try {
    const info = await api("GET",
      `/api/projects/${enc(S.projectName)}/check/${enc(S.currentFile)}`);
    if (info.exists === false) return;
    if (S.fileMtime && info.mtime > S.fileMtime) {
      if (S.modified.has(S.currentFile)) {
        showReloadPrompt();
      } else {
        await openFile(S.currentFile);
      }
    }
  } catch {}
  // Refresh file tree for new/deleted files
  try {
    await refreshFiles();
    renderFileTree();
  } catch {}
}

function showReloadPrompt() {
  if (document.getElementById("reload-bar")) return;
  const bar = document.createElement("div");
  bar.id = "reload-bar";
  bar.style.cssText = "background:var(--accent);color:#fff;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;border-radius:0";
  bar.innerHTML = `<span>${t("file_changed_externally")}</span>
    <span style="display:flex;gap:8px">
      <button onclick="reloadCurrentFile()" style="cursor:pointer;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:3px 10px;border-radius:4px">${t("reload")}</button>
      <button onclick="this.closest('#reload-bar').remove()" style="cursor:pointer;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:3px 10px;border-radius:4px">${t("dismiss")}</button>
    </span>`;
  const container = document.getElementById("editor-container");
  container.parentElement.insertBefore(bar, container);
}

async function reloadCurrentFile() {
  document.getElementById("reload-bar")?.remove();
  S.modified.delete(S.currentFile);
  await openFile(S.currentFile);
}
window.reloadCurrentFile = reloadCurrentFile;

function startFileWatcher() {
  if (_checkTimer) clearInterval(_checkTimer);
  _checkTimer = setInterval(checkFileChanges, 3000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkFileChanges();
});

// ══════════════════════════════════════════
// Compile
// ══════════════════════════════════════════
async function compile() {
  if (S.compiling) {
    // Cancel the running compilation
    if (S.compileId) {
      try {
        await api("POST", `/api/projects/${enc(S.projectName)}/compile/${S.compileId}/cancel`);
      } catch {}
    }
    return;
  }
  S.compiling = true;

  if (S.modified.has(S.currentFile)) await saveCurrentFile();

  const engine = document.getElementById("engine-select").value;
  const btnCompile = document.getElementById("btn-compile");
  btnCompile.textContent = t("cancel");
  openLog();
  clearLog();
  setStatus(t("compiling"));

  try {
    const body = { engine, main_file: S.mainFile, use_docker: S.useDocker };
    if (S.useDocker) body.docker_image = S.dockerImage;

    const result = await api("POST", `/api/projects/${enc(S.projectName)}/compile`, body);
    S.compileId = result.compile_id;
    const evtSource = new EventSource(
      `/api/projects/${enc(S.projectName)}/compile/${result.compile_id}/stream`
    );

    evtSource.addEventListener("log", (e) => {
      const d = JSON.parse(e.data);
      appendLog(d.line, d.level);
    });

    evtSource.addEventListener("done", (e) => {
      const d = JSON.parse(e.data);
      evtSource.close();
      S.compiling = false;
      S.compileId = null;
      btnCompile.textContent = t("compile");

      if (d.status === "success") {
        setStatus(t("compile_success"), "success");
        document.getElementById("log-status").innerHTML = `<span class="badge success">OK</span>`;
      } else if (d.status === "cancelled") {
        setStatus(t("compile_cancelled"), "warning");
        document.getElementById("log-status").innerHTML = `<span class="badge warning">CANCELLED</span>`;
      } else {
        setStatus(t("compile_failed"), "error");
        document.getElementById("log-status").innerHTML = `<span class="badge error">FAILED</span>`;
      }
      if (d.pdf_url) loadPDF(d.pdf_url);
      refreshFiles();
      refreshGit();
    });

    evtSource.onerror = () => {
      evtSource.close();
      S.compiling = false;
      S.compileId = null;
      btnCompile.textContent = t("compile");
      setStatus(t("connection_lost"), "error");
    };
  } catch (err) {
    S.compiling = false;
    S.compileId = null;
    btnCompile.textContent = t("compile");
    setStatus(`${t("compile_error")}: ${err.message}`, "error");
  }
}

// ══════════════════════════════════════════
// PDF Viewer
// ══════════════════════════════════════════
async function loadPDF(url) {
  const container = document.getElementById("pdf-container");
  container.innerHTML = "";
  document.getElementById("pdf-status").textContent = t("loading_pdf");
  S.pdfUrl = url;

  try {
    const pdfUrl = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    const doc = await pdfjsLib.getDocument(pdfUrl).promise;
    S.pdfDoc = doc;
    S.pdfZoom = 1.0;
    updateZoomLabel();
    await renderPDF();
  } catch (err) {
    container.innerHTML = `<div class="pdf-placeholder">${t("pdf_error")}: ${esc(err.message)}</div>`;
    document.getElementById("pdf-status").textContent = t("pdf_error");
  }
}

async function renderPDF() {
  if (!S.pdfDoc) return;
  const container = document.getElementById("pdf-container");
  container.innerHTML = "";
  const doc = S.pdfDoc;
  document.getElementById("pdf-status").textContent = `${doc.numPages} ${t("pages")}`;
  const dpr = S.pdfRenderHD ? (window.devicePixelRatio || 2) : 1;

  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const baseScale = (container.clientWidth - 40) / page.getViewport({ scale: 1 }).width;
    const scale = baseScale * S.pdfZoom;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width * dpr;
    canvas.height = viewport.height * dpr;
    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";
    container.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    await page.render({ canvasContext: ctx, viewport }).promise;
  }
}

function updateZoomLabel() {
  document.getElementById("pdf-zoom-level").textContent = Math.round(S.pdfZoom * 100) + "%";
}
