<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinyleaf</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="loading-overlay">Loading Tinyleaf...</div>

<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <span class="toolbar-brand" id="btn-home" style="cursor:pointer"><img src="/static/assets/logo.svg" alt="" class="toolbar-logo">Tinyleaf</span>
    <span id="toolbar-project-name" style="display:none;align-items:center;gap:8px">
    <span class="toolbar-sep"></span>
    <span id="project-name" style="font-size: 13px; color: var(--text-dim);">&mdash;</span>
    </span>
    <button class="icon-btn" id="btn-sidebar-toggle" title="Toggle sidebar (Ctrl+B)" style="display:none"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span style="flex:1"></span>

    <span id="toolbar-project" style="display:none;align-items:center;gap:8px">
    <select id="main-file-select" title="Main file" data-i18n-title="main_file"></select>
    <select id="engine-select" title="Engine" data-i18n-title="engine">
      <option value="latexmk" selected>latexmk</option>
      <option value="pdflatex">pdflatex</option>
      <option value="lualatex">lualatex</option>
      <option value="xelatex">xelatex</option>
    </select>
    <label id="auto-compile-label" style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-dim);cursor:pointer" title="Auto compile on save" data-i18n-title="auto_compile_title">
      <input type="checkbox" id="auto-compile-toggle" style="cursor:pointer" checked>
      <span data-i18n="auto_compile">Auto</span>
    </label>
    <button id="btn-compile" class="primary" data-i18n="compile">Compile</button>
    <button id="btn-clean" class="sm danger" data-i18n="clean" title="Remove build artifacts" data-i18n-title="clean_title">Clean</button>
    <button id="btn-export-zip" class="sm" data-i18n="export_zip" title="Export project as ZIP" data-i18n-title="export_zip_title">Export ZIP</button>
    <span class="toolbar-sep"></span>
    <button id="btn-save" class="sm" data-i18n="save">Save</button>
    </span>
  </div>

  <div id="main">
    <!-- Project List View -->
    <div id="project-list-view">
      <div class="project-header">
        <h1 data-i18n="projects">Projects</h1>
        <div class="project-toolbar">
          <input type="text" id="project-search" data-i18n-placeholder="search_projects" placeholder="Search projects...">
          <button class="sm" id="btn-open-folder" style="font-size:12px"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" style="vertical-align:-2px"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg> <span data-i18n="open_folder">Open Folder</span></button>
          <button class="sm primary" id="btn-new-project" style="font-size:12px"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" style="vertical-align:-2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> <span data-i18n="new_project">New Project</span></button>
          <button class="view-toggle active" id="btn-view-grid" title="Grid view" data-i18n-title="grid_view"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
          <button class="view-toggle" id="btn-view-list" title="List view" data-i18n-title="list_view"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </div>
      <div id="project-grid" class="project-grid"></div>
    </div>

    <!-- Editor View -->
    <div id="editor-view">
      <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- Sidebar -->
        <div id="sidebar">
          <div class="sidebar-tabs">
            <button class="sidebar-tab active" data-tab="files" data-i18n="files" id="tab-files">Files</button>
            <button class="sidebar-tab" data-tab="git" id="tab-git">Git</button>
            <button class="sidebar-tab" data-tab="search" id="tab-search" data-i18n="search">Search</button>
            <button class="sidebar-tab" data-tab="outline" id="tab-outline" data-i18n="outline">Outline</button>
          </div>
          <div id="sidebar-files">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span data-i18n="files">Files</span>
              <div class="sidebar-actions">
                <button class="icon-btn" id="btn-collapse-all" title="Collapse all" data-i18n-title="collapse_all"><svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
                <button class="icon-btn" id="btn-search-file" title="Search files" data-i18n-title="search_files_title"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="icon-btn" id="btn-upload-file" title="Upload file" data-i18n-title="upload_file_title"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
                <button class="icon-btn" id="btn-new-folder" title="New folder" data-i18n-title="new_folder_title"><svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg></button>
                <button class="icon-btn" id="btn-new-file" title="New file" data-i18n-title="new_file_title"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
              </div>
            </div>
            <div id="file-search-box">
              <input type="text" id="file-search-input" placeholder="Search files..." data-i18n="search_files">
            </div>
            <div id="file-tree"></div>
          </div>
          </div>
          <div id="sidebar-git">
            <div class="sidebar-header">
              <span id="git-branch">Git</span>
              <span style="flex:1"></span>
              <button class="sm" id="btn-git-refresh" style="font-size:10px;padding:1px 6px" title="Refresh" data-i18n-title="refresh">&#x21bb;</button>
            </div>
            <div id="git-files"></div>
            <div id="git-diff-view" style="display:none"></div>
            <div id="git-commit-area">
              <textarea id="git-commit-msg" placeholder="Commit message..." data-i18n-placeholder="commit_message" rows="2"></textarea>
              <div id="git-commit-btns">
                <button class="sm primary" id="btn-git-commit-selected" data-i18n="commit">Commit</button>
                <button class="sm" id="btn-git-push" data-i18n="push">Push</button>
              </div>
            </div>
          </div>
          <div id="sidebar-search">
            <div id="search-input-area">
              <input type="text" id="project-search-input" data-i18n-placeholder="search_in_project_placeholder" placeholder="Search in project...">
              <div id="search-options">
                <label id="search-case-toggle"><input type="checkbox" id="search-case-cb"> <span>Aa</span></label>
              </div>
            </div>
            <div id="search-status"></div>
            <div id="search-results"></div>
          </div>
          <div id="sidebar-outline">
            <div id="outline-status"></div>
            <div id="outline-tree"></div>
          </div>
        </div>

        <div class="resize-handle" id="resize-sidebar"></div>

        <!-- Workspace -->
        <div id="workspace">
          <div id="editor-pane">
            <div id="editor-breadcrumb">
              <button class="icon-btn" id="btn-locate-file" title="Locate in tree" data-i18n-title="locate_in_tree"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2"/><line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2"/><line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/></svg></button>
              <span id="breadcrumb-path">—</span>
              <span style="flex:1"></span>
              <button class="icon-btn" id="btn-close-file" title="Close tab" data-i18n-title="close_tab" style="display:none;padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg></button>
            </div>
            <div id="editor-tabs" role="tablist"></div>
            <div id="editor-container"></div>
            <!-- Diff viewer pane — shown in place of the editor when a git diff is open -->
            <div id="diff-pane">
              <div id="diff-toolbar">
                <svg viewBox="0 0 24 24" style="width:14px;height:14px;flex-shrink:0;stroke:var(--text-dim);fill:none;stroke-width:2"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
                <span id="diff-title">—</span>
                <span style="flex:1"></span>
                <button class="icon-btn" id="btn-diff-refresh" title="Refresh diff" style="padding:2px 4px">
                  <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                </button>
                <button class="icon-btn" id="btn-diff-close" title="Close diff" style="padding:2px 4px">
                  <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div id="diff-content"></div>
            </div>
          </div>
          <div class="resize-handle" id="resize-pdf"></div>
          <div id="pdf-pane">
            <div id="pdf-toolbar">
              <span id="pdf-status" data-i18n="no_pdf">No PDF</span>
              <span id="pdf-page-nav" class="hidden">
                <button class="sm" id="btn-pdf-prev" title="Previous page" data-i18n-title="prev_page">◀</button>
                <input id="pdf-page-input" type="number" min="1" value="1">
                <span id="pdf-page-total">/ 0</span>
                <button class="sm" id="btn-pdf-next" title="Next page" data-i18n-title="next_page">▶</button>
              </span>
              <span style="flex:1"></span>
              <button class="sm" id="btn-pdf-zoom-out" title="Zoom out" data-i18n-title="zoom_out">−</button>
              <span id="pdf-zoom-level" style="min-width:40px;text-align:center;font-size:11px">100%</span>
              <button class="sm" id="btn-pdf-zoom-in" title="Zoom in" data-i18n-title="zoom_in">+</button>
              <button class="sm" id="btn-pdf-zoom-fit" title="Fit width" data-i18n-title="fit_width" data-i18n="fit">Fit</button>
              <span class="toolbar-sep"></span>
              <button class="sm" id="btn-pdf-hd" title="Toggle HD/Fast" data-i18n-title="toggle_hd">HD</button>
              <span class="toolbar-sep"></span>
              <button class="sm" id="btn-pdf-refresh" data-i18n="refresh">Refresh</button>
              <span class="toolbar-sep"></span>
              <button class="sm" id="btn-pdf-search" title="Search in PDF" data-i18n-title="pdf_search_title"><svg viewBox="0 0 24 24" style="width:14px;height:14px;vertical-align:-2px" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
            </div>
            <div id="pdf-search-bar" class="hidden">
              <input id="pdf-search-input" type="text" placeholder="Search in PDF..." data-i18n-placeholder="pdf_search_placeholder">
              <span id="pdf-search-count"></span>
              <button class="sm" id="btn-pdf-search-prev" title="Previous match" data-i18n-title="pdf_search_prev">▲</button>
              <button class="sm" id="btn-pdf-search-next" title="Next match" data-i18n-title="pdf_search_next">▼</button>
              <button class="sm" id="btn-pdf-search-close" title="Close search" data-i18n-title="pdf_search_close">×</button>
            </div>
            <div id="pdf-container">
              <div class="pdf-placeholder" data-i18n="compile_to_preview">Compile to see PDF preview</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Compile Log -->
      <div id="log-panel">
        <div id="log-header">
          <span data-i18n="compile_log">Compile Log</span>
          <span id="log-status"></span>
          <span style="flex:1"></span>
          <button id="btn-log-copy" class="sm" style="font-size:11px;padding:2px 8px" title="Copy log" data-i18n-title="copy_log" data-i18n="copy">Copy</button>
        </div>
        <div id="log-content"></div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <div class="layout-switcher" id="layout-switcher" role="group" style="display:none;margin-right:8px">
      <button class="layout-btn" id="layout-btn-editor" data-layout="editor" title="Editor only">
        <svg viewBox="0 0 20 14" fill="none"><rect x="1" y="1" width="11" height="12" rx="1" fill="currentColor" opacity="0.9"/><rect x="13" y="1" width="6" height="12" rx="1" fill="currentColor" opacity="0.2"/></svg>
      </button>
      <button class="layout-btn active" id="layout-btn-split" data-layout="split" title="Split view">
        <svg viewBox="0 0 20 14" fill="none"><rect x="1" y="1" width="8" height="12" rx="1" fill="currentColor" opacity="0.9"/><rect x="11" y="1" width="8" height="12" rx="1" fill="currentColor" opacity="0.9"/></svg>
      </button>
      <button class="layout-btn" id="layout-btn-pdf" data-layout="pdf" title="PDF only">
        <svg viewBox="0 0 20 14" fill="none"><rect x="1" y="1" width="6" height="12" rx="1" fill="currentColor" opacity="0.2"/><rect x="8" y="1" width="11" height="12" rx="1" fill="currentColor" opacity="0.9"/></svg>
      </button>
    </div>
    <span id="status-left" data-i18n="ready">Ready</span>
    <span style="flex:1"></span>
    <span id="status-right"></span>
    <button class="icon-btn" id="btn-wordcount" title="Word count" data-i18n-title="word_count" style="padding:2px 4px;font-size:11px;font-family:var(--mono)">Wc</button>
    <button class="icon-btn" id="btn-log-toggle" title="Toggle compile log (Ctrl+\`)" data-i18n-title="toggle_log" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
    <button class="icon-btn" id="btn-shortcuts" title="Keyboard shortcuts" data-i18n-title="keyboard_shortcuts" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="14" y2="12"/><line x1="18" y1="12" x2="18" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/></svg></button>
    <button class="icon-btn" id="btn-settings" title="Settings" data-i18n-title="settings" style="padding:2px 4px"><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</div>

<!-- Settings popup (centered modal) -->
<div class="settings-popup" id="settings-popup" onclick="this.classList.remove('open')">
  <div class="settings-popup-panel" onclick="event.stopPropagation()">
    <h3 data-i18n="settings">Settings</h3>
    <!-- Appearance -->
    <div class="settings-popup-item">
      <label data-i18n="theme">Theme</label>
      <select id="theme-select"></select>
    </div>
    <div class="settings-popup-item">
      <label data-i18n="language">Language</label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>
    <div class="settings-popup-item">
      <label data-i18n="editor_font_size">Font size</label>
      <select id="fontsize-select">
        <option value="12">12px</option>
        <option value="13">13px</option>
        <option value="14" selected>14px</option>
        <option value="15">15px</option>
        <option value="16">16px</option>
        <option value="18">18px</option>
        <option value="20">20px</option>
      </select>
    </div>
    <div class="settings-popup-item">
      <label data-i18n="auto_save">Auto save</label>
      <select id="autosave-select">
        <option value="1000">1s</option>
        <option value="2000" selected>2s</option>
        <option value="5000">5s</option>
        <option value="0" data-i18n="off">Off</option>
      </select>
    </div>
    <div class="settings-divider"></div>
    <!-- Docker -->
    <div class="settings-popup-item">
      <label data-i18n="use_docker">Docker</label>
      <input type="checkbox" id="docker-toggle">
    </div>
    <div class="settings-collapsible" id="docker-image-row">
    <div class="settings-popup-item">
      <label data-i18n="docker_image">Image</label>
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0">
        <select id="docker-image-select" style="flex:1;min-width:0"></select>
        <button id="btn-docker-pull" class="sm" style="font-size:11px;padding:2px 6px" data-i18n="pull">Pull</button>
        <button id="btn-docker-rmi" class="sm danger" style="font-size:11px;padding:2px 6px" data-i18n="delete">Del</button>
      </div>
    </div>
    </div>
    <div class="settings-popup-item" id="debian-toggle-row">
      <label data-i18n="show_debian">Show Debian</label>
      <input type="checkbox" id="show-debian-toggle">
    </div>
    <div class="settings-popup-item">
      <label data-i18n="registry_mirror">Registry Mirror</label>
      <input id="registry-mirror-input" type="text" placeholder="docker.1ms.run">
    </div>
    <div class="settings-divider"></div>
    <!-- Advanced -->
    <div class="settings-popup-item">
      <label data-i18n="http_proxy">HTTP Proxy</label>
      <input id="proxy-input" type="text" placeholder="http://localhost:7890">
    </div>
    <div class="settings-popup-item">
      <label data-i18n="js_modules">JS Modules</label>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <span id="vendor-status" style="font-size:12px;color:var(--text-dim)">—</span>
        <button id="btn-update-vendor" class="sm" style="font-size:11px;padding:2px 8px" data-i18n="update">Update</button>
      </div>
    </div>
    <div class="settings-divider"></div>
    <!-- About -->
    <div style="text-align:center;padding:4px 0 2px">
      <div class="about-brand"><img src="/static/assets/logo.svg" alt="" class="about-logo"><span>Tinyleaf</span></div>
      <div id="about-version" style="font-size:11px;color:var(--text-dim);margin-bottom:8px"></div>
      <div style="display:flex;justify-content:center;gap:10px">

<div class="shortcuts-popup" id="shortcuts-popup" onclick="this.classList.remove('open')">
  <div class="shortcuts-popup-panel" onclick="event.stopPropagation()">
    <h3 data-i18n="keyboard_shortcuts">Keyboard Shortcuts</h3>
    <div id="shortcuts-content"></div>
  </div>
</div>
<div class="wordcount-popup" id="wordcount-popup" onclick="this.classList.remove('open')">
  <div class="wordcount-popup-panel" onclick="event.stopPropagation()">
    <h3 data-i18n="word_count">Word Count</h3>
    <div id="wordcount-content"></div>
  </div>
</div>

<!-- Context menu -->
<div class="context-menu" id="context-menu"></div>

<!-- Hidden file upload input -->
<input type="file" id="file-upload-input" multiple>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- Quick Open (Ctrl+P) -->
<div id="quick-open-overlay">
  <div class="quick-open-panel" onclick="event.stopPropagation()">
    <input id="quick-open-input" type="text" autocomplete="off" spellcheck="false">
    <div id="quick-open-results"></div>
    <div class="qo-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="quick_open_hint_nav">navigate</span></span>
      <span><kbd>↵</kbd> <span data-i18n="quick_open_hint_open">open</span></span>
      <span><kbd>Esc</kbd> <span data-i18n="quick_open_hint_close">close</span></span>
    </div>
  </div>
</div>
