<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinyleaf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
<style>
/* ── CSS Variables (Light - default, from llm-rosetta) ── */
:root {
  --bg: #ffffff;
  --bg-card: #f6f8fa;
  --bg-hover: #eef1f5;
  --border: #d1d9e0;
  --text: #1f2328;
  --text-dim: #656d76;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --green: #1a7f37;
  --red: #cf222e;
  --orange: #bf8700;
  --blue: #0969da;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --sidebar-width: 260px;
  --toolbar-height: 48px;
  --statusbar-height: 28px;
}

/* ── Reset ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100vh; }

#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: var(--toolbar-height);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#main { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: var(--sidebar-width);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

#workspace { flex: 1; display: flex; overflow: hidden; }

#editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

#pdf-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-left: 1px solid var(--border);
  min-width: 0;
}

#statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: var(--statusbar-height);
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}

/* ── Toolbar ── */
.toolbar-brand {
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
  margin-right: 4px;
  white-space: nowrap;
}

.toolbar-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 4px;
  flex-shrink: 0;
}

.toolbar-label {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}

/* ── Buttons & Controls ── */
button {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font);
  transition: all 0.15s;
}
button:hover { background: var(--bg-hover); }
button.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
button.primary:hover { background: var(--accent-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.sm { padding: 3px 8px; font-size: 12px; }
button.danger { color: var(--red); }
button.icon-btn {
  padding: 4px 6px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
button.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button.icon-btn:hover { color: var(--accent); background: var(--bg-hover); border-radius: var(--radius); }

select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
}
select:focus { border-color: var(--accent); outline: none; }

/* ── Sidebar ── */
.sidebar-section {
  border-bottom: 1px solid var(--border);
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
}

.sidebar-actions {
  display: flex;
  gap: 2px;
}

.sidebar-actions button.icon-btn {
  padding: 2px 4px;
}
.sidebar-actions button.icon-btn svg { width: 14px; height: 14px; }

/* ── File search ── */
#file-search-box {
  padding: 4px 10px;
  display: none;
}
#file-search-box.open { display: block; }
#file-search-input {
  width: 100%;
  padding: 4px 8px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font);
  outline: none;
}
#file-search-input:focus { border-color: var(--accent); }

#file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0;
}

.tree-dir {
  user-select: none;
}
.tree-dir-header {
  padding: 4px 14px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  font-weight: 500;
  transition: all 0.1s;
}
.tree-dir-header:hover { background: var(--bg-hover); }
.tree-dir-header .arrow {
  display: inline-flex;
  align-items: center;
  width: 14px;
  color: var(--text-dim);
  transition: transform 0.15s;
}
.tree-dir-header .arrow svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.tree-dir-header .arrow.open { transform: rotate(90deg); }
.tree-dir-children {
  display: none;
}
.tree-dir-children.open {
  display: block;
}

.file-item {
  padding: 4px 14px 4px 18px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  transition: all 0.1s;
  font-family: var(--mono);
}
.file-item:hover { background: var(--bg-hover); }
.file-item.active {
  background: var(--bg-hover);
  color: var(--accent);
  font-weight: 500;
}
.file-item.modified::after {
  content: " \u25CF";
  color: var(--orange);
  font-size: 10px;
}

/* ── Git panel ── */
#git-panel {
  max-height: 180px;
  overflow-y: auto;
  flex-shrink: 0;
}

.git-file {
  padding: 3px 14px 3px 18px;
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--mono);
}
.git-status {
  display: inline-block;
  width: 22px;
  font-weight: 700;
  font-size: 11px;
}
.git-status.M { color: var(--orange); }
.git-status.A, .git-status.new { color: var(--green); }
.git-status.D { color: var(--red); }

/* ── Editor ── */
#editor-container { flex: 1; overflow: hidden; }
#editor-container .cm-editor { height: 100%; }
#editor-container .cm-editor .cm-scroller {
  overflow: auto;
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
}
#editor-container .cm-editor .cm-gutters {
  background: var(--bg-card);
  color: var(--text-dim);
  border-right: 1px solid var(--border);
}
#editor-container .cm-editor .cm-activeLine { background: var(--bg-hover); }
#editor-container .cm-editor .cm-activeLineGutter { background: var(--bg-hover); }
#editor-container .cm-editor .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 20%, transparent); }
#editor-container .cm-editor .cm-cursor { border-left-color: var(--accent); }
#editor-container .cm-editor { background: var(--bg); }

/* ── PDF Viewer ── */
#pdf-container {
  flex: 1;
  overflow: auto;
  background: color-mix(in srgb, var(--bg) 80%, #525252);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 16px;
}
#pdf-container canvas { box-shadow: 0 2px 12px rgba(0,0,0,0.15); border-radius: 2px; }

#pdf-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.pdf-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 14px;
}

/* ── Compile Log ── */
#log-panel {
  height: 0;
  overflow: hidden;
  transition: height 0.2s;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#log-panel.open { height: 200px; }

#log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 14px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

#log-content {
  height: calc(100% - 30px);
  overflow-y: auto;
  padding: 6px 14px;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  background: var(--bg);
}

.log-line { padding: 1px 0; }
.log-line.error { color: var(--red); }
.log-line.warning { color: var(--orange); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  min-width: 380px;
  max-width: 540px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.modal h3 { margin-bottom: 16px; font-size: 16px; }
.modal input, .modal textarea {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 14px;
  margin-bottom: 14px;
}
.modal input:focus, .modal textarea:focus {
  border-color: var(--accent);
  outline: none;
}
.modal textarea { resize: vertical; min-height: 60px; font-family: var(--mono); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Project List (multi-project mode) ── */
#project-list-view {
  display: none;
  flex: 1;
  padding: 48px;
  overflow-y: auto;
}
#project-list-view h1 { margin-bottom: 24px; font-size: 24px; }

.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.project-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.project-card h3 { font-size: 16px; margin-bottom: 6px; }
.project-card .meta { font-size: 12px; color: var(--text-dim); }
.project-card .project-path { font-size: 11px; color: var(--text-dim); font-family: var(--mono); word-break: break-all; margin-top: 4px; }
.project-card.stale { opacity: 0.5; border-style: dashed; }
.project-card.stale .project-path::after { content: " (missing)"; color: var(--red); font-family: var(--font); }
.project-card .remove-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  padding: 4px; border-radius: 4px; display: none; line-height: 0;
}
.project-card .remove-btn:hover { color: var(--red); background: var(--bg-hover); }
.project-card:hover .remove-btn { display: block; }
.project-card.create-new {
  border-style: dashed;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 14px;
  gap: 8px;
}
.project-card.create-new:hover { color: var(--accent); border-color: var(--accent); }
.project-card.create-new svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ── Directory Browser ── */
.dir-browser { margin-bottom: 14px; }
.dir-browser .dir-path {
  font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  padding: 6px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0; word-break: break-all;
}
.dir-browser .dir-list {
  max-height: 240px; overflow-y: auto;
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}
.dir-browser .dir-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; cursor: pointer; font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.dir-browser .dir-item:last-child { border-bottom: none; }
.dir-browser .dir-item:hover { background: var(--bg-hover); }
.dir-browser .dir-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.dir-browser .dir-item.parent-dir { font-weight: 600; color: var(--text-dim); }

/* ── Editor View ── */
#editor-view {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

/* ── Settings popup (centered modal) ── */
.settings-popup {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.settings-popup.open { display: flex; }
.settings-popup-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  min-width: 340px;
  max-width: 440px;
  padding: 24px;
}
.settings-popup-panel h3 {
  margin-bottom: 16px;
  font-size: 16px;
  font-weight: 600;
}
.settings-popup-item {
  padding: 8px 0;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.settings-popup-item label {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
.settings-popup-item select, .settings-popup-item input {
  flex: 1;
  min-width: 0;
  padding: 4px 8px;
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono);
}

/* ── Context menu ── */
.context-menu {
  display: none;
  position: fixed;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  min-width: 160px;
  z-index: 300;
  padding: 4px 0;
}
.context-menu.open { display: block; }
.context-menu-item {
  padding: 6px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.1s;
}
.context-menu-item:hover { background: var(--bg-hover); }
.context-menu-item.danger { color: var(--red); }
.context-menu-sep {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* ── Badge ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 11px;
}
.badge.success { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.badge.error { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.badge.info { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }

/* ── Loading overlay ── */
#loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  font-size: 16px;
  color: var(--text-dim);
  transition: opacity 0.3s;
}
#loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Prevent layout shift: hide app until ready */
#app { visibility: hidden; }
#app.ready { visibility: visible; }

/* ── Hidden file upload input ── */
#file-upload-input { display: none; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div id="loading-overlay">Loading Tinyleaf...</div>

<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <span class="toolbar-brand" id="btn-home" style="cursor:pointer">Tinyleaf</span>
    <span class="toolbar-sep"></span>
    <span id="project-name" style="font-size: 13px; color: var(--text-dim);">&mdash;</span>
    <span style="flex:1"></span>

    <select id="engine-select" title="Engine">
      <option value="pdflatex">pdflatex</option>
      <option value="lualatex">lualatex</option>
      <option value="xelatex">xelatex</option>
      <option value="latexmk">latexmk</option>
    </select>
    <button id="btn-compile" class="primary" data-i18n="compile">Compile</button>
    <button id="btn-clean" class="sm danger" data-i18n="clean" title="Remove build artifacts">Clean</button>
    <span class="toolbar-sep"></span>
    <button id="btn-save" class="sm" data-i18n="save">Save</button>
    <button id="btn-commit" class="sm" data-i18n="commit">Commit</button>
    <button id="btn-push" class="sm" data-i18n="push">Push</button>
    <span class="toolbar-sep"></span>
    <button class="icon-btn" id="btn-log-toggle" title="Toggle log"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
  </div>

  <div id="main">
    <!-- Project List View -->
    <div id="project-list-view">
      <h1 data-i18n="projects">Projects</h1>
      <div id="project-grid" class="project-grid"></div>
    </div>

    <!-- Editor View -->
    <div id="editor-view">
      <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- Sidebar -->
        <div id="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span data-i18n="files">Files</span>
              <div class="sidebar-actions">
                <button class="icon-btn" id="btn-search-file" title="Search files"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button class="icon-btn" id="btn-upload-file" title="Upload file"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
                <button class="icon-btn" id="btn-new-folder" title="New folder"><svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg></button>
                <button class="icon-btn" id="btn-new-file" title="New file"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
              </div>
            </div>
            <div id="file-search-box">
              <input type="text" id="file-search-input" placeholder="Search files..." data-i18n="search_files">
            </div>
            <div id="file-tree"></div>
          </div>
          <div class="sidebar-section" id="git-panel">
            <div class="sidebar-header">
              <span id="git-branch">Git</span>
            </div>
            <div id="git-files"></div>
          </div>
        </div>

        <!-- Workspace -->
        <div id="workspace">
          <div id="editor-pane">
            <div id="editor-container"></div>
          </div>
          <div id="pdf-pane">
            <div id="pdf-toolbar">
              <span id="pdf-status" data-i18n="no_pdf">No PDF</span>
              <span style="flex:1"></span>
              <button class="sm" id="btn-pdf-refresh" data-i18n="refresh">Refresh</button>
            </div>
            <div id="pdf-container">
              <div class="pdf-placeholder" data-i18n="compile_to_preview">Compile to see PDF preview</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Compile Log -->

function setTheme(name) {
  const vars = THEMES[name];
  if (!vars) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
  currentTheme = name;
  localStorage.setItem("tinyleaf-theme", name);
  document.getElementById("theme-select").value = name;
}

function initThemeSelect() {
  const sel = document.getElementById("theme-select");
  for (const name of Object.keys(THEMES)) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name.charAt(0).toUpperCase() + name.slice(1).replace("-", " ");
    sel.appendChild(opt);
  }
  sel.value = currentTheme;
  sel.onchange = () => setTheme(sel.value);
}

// ── API ──
async function api(method, path, body = null) {
  const opts = { method, headers: {} };
  if (body !== null) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opts);
  const ct = resp.headers.get("content-type") || "";
  if (ct.includes("application/json")) {
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    return data;
  }
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp;
}

function enc(s) { return encodeURIComponent(s); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function setStatus(msg) { document.getElementById("status-left").textContent = msg; }

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
async function init() {
  initThemeSelect();
  setTheme(currentTheme);
  setLang(currentLang);

  const info = await api("GET", "/api/mode");
  S.mode = info.mode;
  S.useDocker = info.docker;
  S.dockerImage = info.image || "oaklight/texlive:latest";

  // Always load docker images list and sync toggle
  document.getElementById("docker-toggle").checked = S.useDocker;
  document.getElementById("docker-image-row").style.display = S.useDocker ? "flex" : "none";

  // Load global settings (show_debian, etc.)
  try {
    const globalSettings = await api("GET", "/api/settings");
    document.getElementById("show-debian-toggle").checked = !!globalSettings.show_debian;
  } catch {}
  await loadDockerImages();

  if (S.mode === "multi") {
    const lastProject = localStorage.getItem("tinyleaf-project");
    const projects = await api("GET", "/api/projects");
    const names = projects.map(p => p.name);
    if (lastProject && names.includes(lastProject)) {
      await openProject(lastProject);
    } else {
      showProjectList();
    }
  } else {
    const projects = await api("GET", "/api/projects");
    if (projects.length > 0) openProject(projects[0].name);
  }

  setupKeybindings();
  setupSettingsPopup();
  setupFileSearch();
  setupUpload();
  startFileWatcher();
  setStatus(t("ready"));

  // Reveal UI
  document.getElementById("app").classList.add("ready");
  const overlay = document.getElementById("loading-overlay");
  overlay.classList.add("hidden");
  setTimeout(() => overlay.remove(), 300);
}

// ── Settings popup (centered modal) ──
function setupSettingsPopup() {
  const btn = document.getElementById("btn-settings");
  const popup = document.getElementById("settings-popup");

  btn.onclick = (e) => {
    e.stopPropagation();
    popup.classList.toggle("open");
    closeContextMenu();
  };

  document.getElementById("lang-select").onchange = (e) => setLang(e.target.value);

  // Font size
  const savedFontSize = localStorage.getItem("tinyleaf-fontsize") || "14";
  document.getElementById("fontsize-select").value = savedFontSize;
  document.getElementById("fontsize-select").onchange = (e) => {
    const size = e.target.value;
    localStorage.setItem("tinyleaf-fontsize", size);
    document.querySelector("#editor-container").style.fontSize = size + "px";
  };
  document.querySelector("#editor-container").style.fontSize = savedFontSize + "px";

  // Auto save interval
  const savedAutoSave = localStorage.getItem("tinyleaf-autosave") || "2000";
  document.getElementById("autosave-select").value = savedAutoSave;
  S.autoSaveInterval = parseInt(savedAutoSave, 10);
  document.getElementById("autosave-select").onchange = (e) => {
    const val = e.target.value;
    localStorage.setItem("tinyleaf-autosave", val);
    S.autoSaveInterval = parseInt(val, 10);
  };

  document.getElementById("docker-toggle").onchange = (e) => {
    S.useDocker = e.target.checked;
    document.getElementById("docker-image-row").style.display = S.useDocker ? "flex" : "none";
    if (S.projectName) {
      api("PUT", `/api/projects/${enc(S.projectName)}/config`, { use_docker: S.useDocker });
    }
  };

  document.getElementById("docker-image-select").onchange = (e) => {
    S.dockerImage = e.target.value;
    if (S.projectName) {
      api("PUT", `/api/projects/${enc(S.projectName)}/config`, { docker_image: S.dockerImage });
    }
  };

  document.getElementById("show-debian-toggle").onchange = (e) => {
    api("PUT", "/api/settings", { show_debian: e.target.checked });
    loadDockerImages(true);
  };

  // Vendor JS modules status + update
  checkVendorStatus();
  document.getElementById("btn-update-vendor").onclick = async () => {
    const btn = document.getElementById("btn-update-vendor");
    const status = document.getElementById("vendor-status");
    const proxy = document.getElementById("proxy-input").value.trim();
    btn.disabled = true;
    status.textContent = t("downloading");
    try {
      await api("POST", "/api/vendor/update", { proxy });
      status.textContent = t("vendor_local") + " \u2713";
    } catch (e) {
      status.textContent = "Error: " + e.message;
    } finally {
      btn.disabled = false;
    }
  };
}

async function checkVendorStatus() {
  const el = document.getElementById("vendor-status");
  try {
    const data = await api("GET", "/api/vendor/status");
    // Load saved proxy
    if (data.proxy) document.getElementById("proxy-input").value = data.proxy;
    if (data.ready) {
      const d = data.manifest.updated_at?.slice(0, 10) || "";
      el.textContent = t("vendor_local") + (d ? ` (${d})` : "");
    } else {
      el.textContent = t("vendor_cdn");
    }
  } catch {
    el.textContent = "—";
  }
}

let _allDockerImages = [];

async function loadDockerImages(filterOnly) {
  const sel = document.getElementById("docker-image-select");
  sel.innerHTML = "";
  try {
    if (!filterOnly || !_allDockerImages.length) {
      _allDockerImages = await api("GET", "/api/docker/images");
    }
    const showDebian = document.getElementById("show-debian-toggle")?.checked;
    const images = _allDockerImages.filter(img =>
      showDebian || !img.name.startsWith("debian")
    );
    for (const img of images) {
      const opt = document.createElement("option");
      opt.value = img.tag;
      opt.textContent = img.local ? `${img.name} ✓` : img.name;
      sel.appendChild(opt);
    }
    const match = images.find(i => i.tag === S.dockerImage);
    if (match) {
      sel.value = match.tag;
    } else if (images.length > 0) {
      sel.value = images[0].tag;
      S.dockerImage = images[0].tag;
    }
  } catch {
    const opt = document.createElement("option");
    opt.value = S.dockerImage;
    opt.textContent = S.dockerImage;
    sel.appendChild(opt);
  }
}

// ══════════════════════════════════════════
// File Upload
// ══════════════════════════════════════════
let uploadTargetDir = "";

function setupUpload() {
  const input = document.getElementById("file-upload-input");
  input.addEventListener("change", async () => {
    if (!input.files.length || !S.projectName) return;
    const formData = new FormData();
    if (uploadTargetDir) formData.append("target_dir", uploadTargetDir);
    for (const file of input.files) formData.append("file", file);

    try {
      const resp = await fetch(`/api/projects/${enc(S.projectName)}/upload`, {
        method: "POST",
        body: formData,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Upload failed");
      setStatus(t("uploaded").replace("{n}", data.count));
      await refreshFiles();
    } catch (err) {
      setStatus(`Upload error: ${err.message}`);
    }
    input.value = "";
    uploadTargetDir = "";
  });
}

function triggerUpload(targetDir = "") {
  uploadTargetDir = targetDir;
  document.getElementById("file-upload-input").click();
}

// ══════════════════════════════════════════
// Context Menu
// ══════════════════════════════════════════
function closeContextMenu() {
  document.getElementById("context-menu").classList.remove("open");
}

function showContextMenu(e, items) {
  e.preventDefault();
  e.stopPropagation();

  const menu = document.getElementById("context-menu");
  menu.innerHTML = "";
  for (const item of items) {
    if (item === "sep") {
      const sep = document.createElement("div");
      sep.className = "context-menu-sep";
      menu.appendChild(sep);
      continue;
    }
    const div = document.createElement("div");
    div.className = "context-menu-item" + (item.danger ? " danger" : "");
    div.textContent = item.label;
    div.onclick = () => { closeContextMenu(); item.action(); };
    menu.appendChild(div);
  }

  // Position the menu
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.classList.add("open");

  // Adjust if overflows
  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + "px";
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + "px";
  });
}

document.addEventListener("click", closeContextMenu);
document.addEventListener("contextmenu", (e) => {
  // Close any open context menu when right-clicking elsewhere
  const menu = document.getElementById("context-menu");
  if (menu.classList.contains("open") && !menu.contains(e.target)) {
    closeContextMenu();
  }
});

function fileContextMenu(e, node) {
  const items = [];
  if (node.type === "file") {
    items.push({ label: t("open"), action: () => openFile(node.path) });
    items.push("sep");
  }
  items.push({ label: t("rename"), action: () => showRenameModal(node) });

  if (node.type === "dir") {
    items.push("sep");
    items.push({ label: t("new_file_here"), action: () => showNewFileInDirModal(node.path) });
    items.push({ label: t("new_folder_here"), action: () => showNewFolderInDirModal(node.path) });
    items.push({ label: t("upload_here"), action: () => triggerUpload(node.path) });
  }

  if (node.type === "file") {
    items.push({ label: t("download"), action: () => downloadFile(node.path) });
  }

  items.push("sep");
  items.push({ label: t("delete"), danger: true, action: () => confirmDelete(node) });

  showContextMenu(e, items);
}

function showRenameModal(node) {
  const oldName = node.name;
  showModal(t("rename_title"), `<input id="inp-rename" value="${esc(oldName)}" autofocus>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("rename"), primary: true, action: async () => {
      const newName = document.getElementById("inp-rename").value.trim();
      if (!newName || newName === oldName) { closeModal(); return; }
      const parentDir = node.path.includes("/") ? node.path.substring(0, node.path.lastIndexOf("/")) : "";
      const newPath = parentDir ? parentDir + "/" + newName : newName;
      try {
        await api("POST", `/api/projects/${enc(S.projectName)}/rename`, { old_path: node.path, new_path: newPath });
        closeModal();
        setStatus(`${t("renamed")}: ${newName}`);
        await refreshFiles();
        if (S.currentFile === node.path) {
          S.currentFile = newPath;
          await openFile(newPath);
        }
      } catch (err) {
        setStatus(`Rename error: ${err.message}`);
      }
    }},
  ]);
  setTimeout(() => {
    const inp = document.getElementById("inp-rename");
    if (inp) { inp.focus(); inp.select(); }
  }, 50);
}

function confirmDelete(node) {
  const msg = t("confirm_delete").replace("{name}", node.name);
  showModal(t("delete"), `<p style="margin-bottom:14px">${esc(msg)}</p>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("delete"), primary: true, action: async () => {
      try {
        await api("DELETE", `/api/projects/${enc(S.projectName)}/files/${enc(node.path)}`);
        closeModal();
        setStatus(`${t("deleted")}: ${node.name}`);
        if (S.currentFile === node.path) S.currentFile = null;
        await refreshFiles();
      } catch (err) {
        setStatus(`Delete error: ${err.message}`);
      }
    }},
  ]);
}

function downloadFile(filePath) {
  const url = `/api/projects/${enc(S.projectName)}/files/${enc(filePath)}`;
  // Read and download via blob
  fetch(url).then(r => r.json()).then(data => {
    const blob = new Blob([data.content], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filePath.split("/").pop();
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function showNewFileInDirModal(dirPath) {
  showModal(t("new_file_title"), `<input id="inp-newfile" placeholder="${t("filename")}" autofocus>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("create"), primary: true, action: async () => {
      const fname = document.getElementById("inp-newfile").value.trim();
      if (!fname) return;
      const fullPath = dirPath ? dirPath + "/" + fname : fname;
      await api("PUT", `/api/projects/${enc(S.projectName)}/files/${enc(fullPath)}`, { content: "" });
      closeModal();
      expandedDirs.add(dirPath);
      await refreshFiles();
      await openFile(fullPath);
    }},
  ]);
  setTimeout(() => document.getElementById("inp-newfile")?.focus(), 50);
}

function showNewFolderInDirModal(dirPath) {
  showModal(t("new_folder_title"), `<input id="inp-newfolder" placeholder="${t("foldername")}" autofocus>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("create"), primary: true, action: async () => {
      const fname = document.getElementById("inp-newfolder").value.trim();
      if (!fname) return;
      const fullPath = dirPath ? dirPath + "/" + fname : fname;
      try {
        await api("POST", `/api/projects/${enc(S.projectName)}/mkdir`, { path: fullPath });
        closeModal();
        expandedDirs.add(dirPath);
        expandedDirs.add(fullPath);
        await refreshFiles();
      } catch (err) {
        setStatus(`Error: ${err.message}`);
      }
    }},
  ]);
  setTimeout(() => document.getElementById("inp-newfolder")?.focus(), 50);
}

// ── Directory Browser ──
async function loadDirBrowser(containerId, startPath) {
  const container = document.getElementById(containerId);
  const path = startPath || "~";
  const data = await api("GET", `/api/fs/browse?path=${encodeURIComponent(path)}`);
  renderDirBrowser(containerId, data.path, data.dirs);
}

function renderDirBrowser(containerId, currentPath, dirs) {
  const container = document.getElementById(containerId);
  container.innerHTML = `<div class="dir-path">${esc(currentPath)}</div><div class="dir-list"></div>`;
  const list = container.querySelector(".dir-list");

  // Auto-fill project name from path basename (Open Folder modal only)
  const nameInput = document.getElementById("inp-folder-name");
  if (nameInput) {
    const basename = currentPath.replace(/\/+$/, "").split("/").pop() || "";
    nameInput.value = basename;
  }

  // Parent directory entry
  const parentPath = currentPath.replace(/\/[^/]+\/?$/, "") || "/";
  if (currentPath !== "/") {
    const parentItem = document.createElement("div");
    parentItem.className = "dir-item parent-dir";
    parentItem.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> ..`;
    parentItem.onclick = () => navigateDir(containerId, parentPath);
    list.appendChild(parentItem);
  }

  for (const d of dirs) {
    const item = document.createElement("div");
    item.className = "dir-item";
    item.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>${esc(d)}`;
    const fullPath = currentPath === "/" ? "/" + d : currentPath + "/" + d;
    item.onclick = () => navigateDir(containerId, fullPath);
    list.appendChild(item);
  }

  if (dirs.length === 0 && currentPath === "/") {
    const empty = document.createElement("div");
    empty.className = "dir-item";
    empty.style.color = "var(--text-dim)";
    empty.textContent = "(empty)";
    list.appendChild(empty);
  }
}

async function navigateDir(containerId, path) {
  try {
    const data = await api("GET", `/api/fs/browse?path=${encodeURIComponent(path)}`);
    renderDirBrowser(containerId, data.path, data.dirs);
  } catch (err) {
    setStatus(`Error: ${err.message}`);
  }
}

// Open Project
// ══════════════════════════════════════════
async function openProject(name) {
  S.projectName = name;
  localStorage.setItem("tinyleaf-project", name);
  document.getElementById("project-name").textContent = name;
  document.getElementById("project-list-view").style.display = "none";
  document.getElementById("editor-view").style.display = "flex";

  const config = await api("GET", `/api/projects/${enc(name)}/config`);
  document.getElementById("engine-select").value = config.engine || "pdflatex";

  // Sync docker toggle with project config
  if ("use_docker" in config) {
    S.useDocker = config.use_docker;
    document.getElementById("docker-toggle").checked = S.useDocker;
    document.getElementById("docker-image-row").style.display = S.useDocker ? "flex" : "none";
  }
  if (config.docker_image) {
    S.dockerImage = config.docker_image;
    document.getElementById("docker-image-select").value = S.dockerImage;
  }

  await refreshFiles();

  const mainFile = config.main_file || "main.tex";
  if (S.files.includes(mainFile)) await openFile(mainFile);
  else if (S.files.length > 0) await openFile(S.files[0]);

  await refreshGit();

  // Try loading existing PDF
  const pdfName = (config.main_file || "main.tex").replace(/\.tex$/, ".pdf");
  try {
    const r = await fetch(`/api/projects/${enc(name)}/output/${enc(pdfName)}`);
    if (r.ok) loadPDF(`/api/projects/${enc(name)}/output/${enc(pdfName)}`);
  } catch {}
}

// ══════════════════════════════════════════
// File Tree
// ══════════════════════════════════════════
async function refreshFiles() {
  S.fileTree = await api("GET", `/api/projects/${enc(S.projectName)}/files`);
  // Flatten for quick lookups
  S.files = [];
  function collect(nodes) {
    for (const n of nodes) {
      if (n.type === "file") S.files.push(n.path);
      else if (n.children) collect(n.children);
    }
  }
  collect(S.fileTree);
  renderFileTree();
}

// Track which dirs are expanded (persisted in memory)
const expandedDirs = new Set();

function renderFileTree(searchFilter = "") {
  const container = document.getElementById("file-tree");
  container.innerHTML = "";
  if (searchFilter) {
    renderFilteredFiles(searchFilter, container);
  } else {
    renderTreeNodes(S.fileTree || [], container, 0);
  }
}

function renderFilteredFiles(query, parent) {
  for (const filePath of S.files) {
    if (!filePath.toLowerCase().includes(query)) continue;
    const div = document.createElement("div");
    div.className = "file-item" + (filePath === S.currentFile ? " active" : "");
    div.textContent = filePath;
    div.title = filePath;
    div.onclick = () => openFile(filePath);
    parent.appendChild(div);
  }
}

function renderTreeNodes(nodes, parent, depth) {
  for (const node of nodes) {
    if (node.name === ".tinyleaf.json") continue;

    if (node.type === "dir") {
      const dirEl = document.createElement("div");
      dirEl.className = "tree-dir";

      const header = document.createElement("div");
      header.className = "tree-dir-header";
      header.style.paddingLeft = (14 + depth * 16) + "px";

      const isOpen = expandedDirs.has(node.path);
      header.innerHTML = `<span class="arrow ${isOpen ? "open" : ""}"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span> ${esc(node.name)}`;
      header.onclick = () => {
        if (expandedDirs.has(node.path)) expandedDirs.delete(node.path);
        else expandedDirs.add(node.path);
        renderFileTree();
      };
      header.oncontextmenu = (e) => fileContextMenu(e, node);
      dirEl.appendChild(header);

      const childrenEl = document.createElement("div");
      childrenEl.className = "tree-dir-children" + (isOpen ? " open" : "");
      renderTreeNodes(node.children || [], childrenEl, depth + 1);
      dirEl.appendChild(childrenEl);

      parent.appendChild(dirEl);
    } else {
      const div = document.createElement("div");
      div.className = "file-item" +
        (node.path === S.currentFile ? " active" : "") +
        (S.modified.has(node.path) ? " modified" : "");
      div.style.paddingLeft = (18 + depth * 16) + "px";
      div.textContent = node.name;
      div.title = node.path;
      div.onclick = () => openFile(node.path);
      div.oncontextmenu = (e) => fileContextMenu(e, node);
      parent.appendChild(div);
    }
  }
}

// ══════════════════════════════════════════
// Editor
// ══════════════════════════════════════════
async function openFile(filePath) {
  if (S.currentFile && S.modified.has(S.currentFile)) await saveCurrentFile();

  // PDF files: load in preview panel instead of editor
  if (filePath.endsWith(".pdf")) {
    const url = `/api/projects/${enc(S.projectName)}/output/${enc(filePath)}`;
    loadPDF(url);
    return;
  }

  const data = await api("GET", `/api/projects/${enc(S.projectName)}/files/${enc(filePath)}`);
  S.currentFile = filePath;
  S.fileMtime = data.mtime || 0;
  document.getElementById("reload-bar")?.remove();

  if (S.editorView) S.editorView.destroy();

  const extensions = [
    lineNumbers(),
    highlightActiveLine(),
    highlightActiveLineGutter(),
    drawSelection(),
    history(),
    bracketMatching(),
    closeBrackets(),
    foldGutter(),
    autocompletion(),
    search(),
    highlightSelectionMatches(),
    syntaxHighlighting(defaultHighlightStyle),
    keymap.of([
      ...defaultKeymap, ...historyKeymap, ...closeBracketsKeymap,
      ...foldKeymap, ...searchKeymap, indentWithTab,
    ]),
    EditorView.updateListener.of((update) => {
      if (update.docChanged) {
        S.modified.add(S.currentFile);
        renderFileTree();
        scheduleAutoSave();
      }
    }),
    EditorView.lineWrapping,
  ];
  if (cmLaTeX?.latex) extensions.push(cmLaTeX.latex());

  S.editorView = new EditorView({
    state: EditorState.create({ doc: data.content, extensions }),
    parent: document.getElementById("editor-container"),
  });
  renderFileTree();
}

function scheduleAutoSave() {
  if (S.autoSaveInterval <= 0) return;
  if (S.autoSaveTimer) clearTimeout(S.autoSaveTimer);
  S.autoSaveTimer = setTimeout(() => saveCurrentFile(), S.autoSaveInterval);
}

async function saveCurrentFile() {
  if (!S.currentFile || !S.editorView) return;
  const content = S.editorView.state.doc.toString();
  await api("PUT", `/api/projects/${enc(S.projectName)}/files/${enc(S.currentFile)}`, { content });
  S.modified.delete(S.currentFile);
  renderFileTree();
  setStatus(`${t("saved")} ${S.currentFile}`);
}

// ══════════════════════════════════════════
// File Change Detection
// ══════════════════════════════════════════
let _checkTimer = null;

async function checkFileChanges() {
  if (!S.projectName || !S.currentFile) return;
  // Check current file mtime
  try {
    const info = await api("GET",
      `/api/projects/${enc(S.projectName)}/check/${enc(S.currentFile)}`);
    if (info.exists === false) return;
    if (S.fileMtime && info.mtime > S.fileMtime) {
      if (S.modified.has(S.currentFile)) {
        showReloadPrompt();
      } else {
        await openFile(S.currentFile);
      }
    }
  } catch {}
  // Refresh file tree for new/deleted files
  try {
    await refreshFiles();
    renderFileTree();
  } catch {}
}

function showReloadPrompt() {
  if (document.getElementById("reload-bar")) return;
  const bar = document.createElement("div");
  bar.id = "reload-bar";
  bar.style.cssText = "background:var(--accent);color:#fff;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;border-radius:0";
  bar.innerHTML = `<span>${t("file_changed_externally")}</span>
    <span style="display:flex;gap:8px">
      <button onclick="reloadCurrentFile()" style="cursor:pointer;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:3px 10px;border-radius:4px">${t("reload")}</button>
      <button onclick="this.closest('#reload-bar').remove()" style="cursor:pointer;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:3px 10px;border-radius:4px">${t("dismiss")}</button>
    </span>`;
  const container = document.getElementById("editor-container");
  container.parentElement.insertBefore(bar, container);
}

async function reloadCurrentFile() {
  document.getElementById("reload-bar")?.remove();
  S.modified.delete(S.currentFile);
  await openFile(S.currentFile);
}

function startFileWatcher() {
  if (_checkTimer) clearInterval(_checkTimer);
  _checkTimer = setInterval(checkFileChanges, 3000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkFileChanges();
});

// ══════════════════════════════════════════
// Compile
// ══════════════════════════════════════════
async function compile() {
  if (S.compiling) return;
  S.compiling = true;

  if (S.modified.has(S.currentFile)) await saveCurrentFile();

  const engine = document.getElementById("engine-select").value;
  const btnCompile = document.getElementById("btn-compile");
  btnCompile.disabled = true;
  btnCompile.textContent = t("compiling");
  openLog();
  clearLog();
  setStatus(t("compiling"));

  try {
    const body = { engine, use_docker: S.useDocker };
    if (S.useDocker) body.docker_image = S.dockerImage;

    const result = await api("POST", `/api/projects/${enc(S.projectName)}/compile`, body);
    const evtSource = new EventSource(
      `/api/projects/${enc(S.projectName)}/compile/${result.compile_id}/stream`
    );

    evtSource.addEventListener("log", (e) => {
      const d = JSON.parse(e.data);
      appendLog(d.line, d.level);
    });

    evtSource.addEventListener("done", (e) => {
      const d = JSON.parse(e.data);
      evtSource.close();
      S.compiling = false;
      btnCompile.disabled = false;
      btnCompile.textContent = t("compile");

      if (d.status === "success") {
        setStatus(t("compile_success"));
        document.getElementById("log-status").innerHTML = `<span class="badge success">OK</span>`;
      } else {
        setStatus(t("compile_failed"));
        document.getElementById("log-status").innerHTML = `<span class="badge error">FAILED</span>`;
      }
      if (d.pdf_url) loadPDF(d.pdf_url);
      refreshFiles();
      refreshGit();
    });

    evtSource.onerror = () => {
      evtSource.close();
      S.compiling = false;
      btnCompile.disabled = false;
      btnCompile.textContent = t("compile");
      setStatus(t("connection_lost"));
    };
  } catch (err) {
    S.compiling = false;
    btnCompile.disabled = false;
    btnCompile.textContent = t("compile");
    setStatus(`${t("compile_error")}: ${err.message}`);
  }
}

// ══════════════════════════════════════════
// Clean
// ══════════════════════════════════════════
async function doClean() {
  if (!S.projectName) return;
  try {
    const r = await api("POST", `/api/projects/${enc(S.projectName)}/clean`);
    setStatus(t("cleaned").replace("{n}", r.count));
    await refreshFiles();
  } catch (err) {
    setStatus(`Clean error: ${err.message}`);
  }
}

// ══════════════════════════════════════════
// PDF Viewer
// ══════════════════════════════════════════
async function loadPDF(url) {
  const container = document.getElementById("pdf-container");
  container.innerHTML = "";
  document.getElementById("pdf-status").textContent = t("loading_pdf");

  try {
    const pdfUrl = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    const doc = await pdfjsLib.getDocument(pdfUrl).promise;
    S.pdfDoc = doc;
    document.getElementById("pdf-status").textContent = `${doc.numPages} ${t("pages")}`;

    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const scale = (container.clientWidth - 40) / page.getViewport({ scale: 1 }).width;
      const viewport = page.getViewport({ scale: Math.min(scale, 2) });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      container.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }
  } catch (err) {
    container.innerHTML = `<div class="pdf-placeholder">${t("pdf_error")}: ${esc(err.message)}</div>`;
    document.getElementById("pdf-status").textContent = t("pdf_error");
  }
}

// ══════════════════════════════════════════
// Compile Log
// ══════════════════════════════════════════
function openLog() { document.getElementById("log-panel").classList.add("open"); }
function toggleLog() { document.getElementById("log-panel").classList.toggle("open"); }
function clearLog() {
  document.getElementById("log-content").innerHTML = "";
  document.getElementById("log-status").innerHTML = "";
}
function appendLog(line, level = "info") {
  const el = document.getElementById("log-content");
  const div = document.createElement("div");
  div.className = "log-line " + level;
  div.textContent = line;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ══════════════════════════════════════════
// Git
// ══════════════════════════════════════════
async function refreshGit() {
  try {
    const st = await api("GET", `/api/projects/${enc(S.projectName)}/git/status`);
    if (!st.git) { document.getElementById("git-panel").style.display = "none"; return; }
    document.getElementById("git-panel").style.display = "";
    document.getElementById("git-branch").textContent =
      `${st.branch || "???"}` +
      (st.ahead ? ` \u2191${st.ahead}` : "") +
      (st.behind ? ` \u2193${st.behind}` : "");

    const fd = document.getElementById("git-files");
    fd.innerHTML = "";
    for (const f of st.files) {
      const cls = f.status === "??" ? "new" : f.status.includes("D") ? "D" : "M";
      const div = document.createElement("div");
      div.className = "git-file";
      div.innerHTML = `<span class="git-status ${cls}">${esc(f.status)}</span>${esc(f.path)}`;
      fd.appendChild(div);
    }
  } catch { document.getElementById("git-panel").style.display = "none"; }
}

async function doCommit() {
  showModal(t("git_commit_title"), `<textarea id="inp-commit" placeholder="${t("commit_message")}" rows="3"></textarea>`, [
    { label: t("cancel"), action: closeModal },
    { label: t("commit"), primary: true, action: async () => {
      const msg = document.getElementById("inp-commit").value.trim();
      if (!msg) return;
      if (S.modified.has(S.currentFile)) await saveCurrentFile();
      const r = await api("POST", `/api/projects/${enc(S.projectName)}/git/commit`, { message: msg });
      closeModal();
      setStatus(r.success ? t("committed") : r.message);
      refreshGit();
    }},
  ]);
  setTimeout(() => document.getElementById("inp-commit")?.focus(), 50);
}

async function doPush() {
  setStatus(t("pushing"));
  const r = await api("POST", `/api/projects/${enc(S.projectName)}/git/push`);
  setStatus(r.success ? t("pushed") : r.message);
  refreshGit();
}

// ══════════════════════════════════════════
// New File / Folder (root level)
// ══════════════════════════════════════════
function showNewFileModal() {
  showNewFileInDirModal("");
}

function showNewFolderModal() {
  showNewFolderInDirModal("");
}

// ══════════════════════════════════════════
// Modal
// ══════════════════════════════════════════
function showModal(title, bodyHtml, buttons) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = bodyHtml;
  const actions = document.getElementById("modal-actions");
  actions.innerHTML = "";
  for (const b of buttons) {
    const btn = document.createElement("button");
    btn.textContent = b.label;
    if (b.primary) btn.className = "primary";
    btn.onclick = b.action;
    actions.appendChild(btn);
  }
  const overlay = document.getElementById("modal-overlay");
  overlay.style.display = "flex";
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

function closeModal() { document.getElementById("modal-overlay").style.display = "none"; }

// ══════════════════════════════════════════
// Keyboard Shortcuts
// ══════════════════════════════════════════
function setupKeybindings() {
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveCurrentFile(); }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); compile(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "C") { e.preventDefault(); doCommit(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "P") { e.preventDefault(); doPush(); }
    if (e.key === "Escape") { closeModal(); closeContextMenu(); document.getElementById("settings-popup").classList.remove("open"); }
  });
}

// ══════════════════════════════════════════
// Wire up buttons
// ══════════════════════════════════════════
document.getElementById("btn-home").onclick = () => {
  if (S.mode === "multi") {
    if (S.currentFile && S.modified.has(S.currentFile)) saveCurrentFile();
    S.projectName = null;
    S.currentFile = null;
    document.getElementById("project-name").textContent = "\u2014";
    if (S.editorView) { S.editorView.destroy(); S.editorView = null; }
    showProjectList();
  }
};
document.getElementById("btn-compile").onclick = compile;
document.getElementById("btn-clean").onclick = doClean;
document.getElementById("btn-save").onclick = saveCurrentFile;
document.getElementById("btn-commit").onclick = doCommit;
document.getElementById("btn-push").onclick = doPush;
document.getElementById("btn-log-toggle").onclick = toggleLog;
document.getElementById("btn-new-file").onclick = showNewFileModal;
document.getElementById("btn-new-folder").onclick = showNewFolderModal;
document.getElementById("btn-search-file").onclick = toggleFileSearch;
document.getElementById("btn-upload-file").onclick = () => triggerUpload("");
document.getElementById("log-header").onclick = toggleLog;
document.getElementById("btn-pdf-refresh").onclick = () => {
  if (S.projectName) {
    const base = (S.currentFile || "main.tex").replace(/\.tex$/, ".pdf");
    loadPDF(`/api/projects/${enc(S.projectName)}/output/${enc(base)}`);
  }
};

// ── Auto-refresh on window focus ──
window.addEventListener("focus", () => {
  if (S.projectName) {
    refreshFiles();
    refreshGit();
  }
});

// ── Start ──
init();
