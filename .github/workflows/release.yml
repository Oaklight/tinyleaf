name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0)"
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version
        run: |
          VER="${{ inputs.version }}"
          if git tag -l "v${VER}" | grep -q .; then
            echo "::error::Tag v${VER} already exists"
            exit 1
          fi
          echo "Release version: ${VER}"

      - name: Bump version, commit, and tag
        run: |
          VER="${{ inputs.version }}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/tinyleaf/__init__.py
          grep __version__ src/tinyleaf/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/tinyleaf/__init__.py
          git diff --cached --quiet || git commit -m "chore: bump version to ${VER}"
          git tag "v${VER}"
          git push origin HEAD --tags

  build-publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  github-release:
    needs: build-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
