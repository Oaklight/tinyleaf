name: Lint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff ty

      - name: ruff check
        run: ruff check src/

      - name: ruff format check
        run: ruff format --check src/

      - name: ty check
        run: ty check
